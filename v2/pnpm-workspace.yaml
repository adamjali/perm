packages:
  - .
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Supply-chain floors (Audit 10, 2026-09-09). A version has to be a week old
# before pnpm will resolve to it, which is the window in which a hijacked
# publish is usually caught and pulled; the lockfile is unaffected, so CI's
# frozen install keeps working and only the next `pnpm update` waits. The
# other two stop a dependency from downgrading its own security settings and
# from pulling sub-dependencies off git or tarball URLs.
minimumReleaseAge: 10080
# Rolldown ships a fresh set of per-platform binaries with every release, and
# a lockfile refresh can land hours after one; there is no older version of a
# new binding to fall back to, so the floor would block the install outright.
# These are optional platform packages pulled in by vite, never imported here.
minimumReleaseAgeExclude:
  - "@rolldown/*"
  # A package under an ACTIVE advisory is excluded by exact version, because
  # the point of taking it is to take the patch now. Remove each line once that
  # version is old enough to clear the window on its own (browserslist, the
  # first one, left Oct 5 2026; source-map-js Oct 24 2026).
  #
  # Next 16.4.3 (Oct 23 2026) carries GHSA-673q-mjm6-r5xr (critical, `use
  # cache`), GHSA-2464-fhr4-w9xw (critical, image optimizer) and
  # GHSA-p3m5-59mp-jv5r (high, Server Actions), none reachable here, and the
  # extensionless Google font fix that let patches/next@16.4.0.patch go. Each
  # package of the release is named. Remove after Oct 30 2026.
  - "next@16.4.3"
  - "@next/env@16.4.3"
  - "@next/swc-darwin-arm64@16.4.3"
  - "@next/swc-darwin-x64@16.4.3"
  - "@next/swc-linux-arm64-gnu@16.4.3"
  - "@next/swc-linux-arm64-musl@16.4.3"
  - "@next/swc-linux-x64-gnu@16.4.3"
  - "@next/swc-linux-x64-musl@16.4.3"
  - "@next/swc-win32-arm64-msvc@16.4.3"
  - "@next/swc-win32-x64-msvc@16.4.3"
  - "eslint-config-next@16.4.3"
  - "@next/eslint-plugin-next@16.4.3"
  - "@next/bundle-analyzer@16.4.3"
  # happy-dom 21.0.4 (Oct 20 2026) is the first release past the vulnerable
  # 21.0.3; remove after Oct 27 2026. fast-uri 3.1.9 (Oct 19 2026) is the
  # override's new floor; remove after Oct 26 2026.
  - "happy-dom@21.0.4"
  - "fast-uri@3.1.9"
trustPolicy: no-downgrade
# A version excluded by name has been checked by hand: semver 6.3.1 is npm's
# own 2023 patch to the old 6.x line (published Jul 10 2023 by a semver
# maintainer, integrity matching the lockfile's), released after 7.5.x carried
# provenance, which is the pattern no-downgrade misreads as a takeover. It
# blocked the sharp 0.35.5 security update (GHSA-wq5f-xc86-pv6w) on Oct 7 2026.
# eslint-import-resolver-typescript 3.10.1 is the same pattern: a patch to the
# 3.x line (Apr 21 2025, published by a listed maintainer) after 4.0.0 (Mar 16
# 2025) started carrying provenance; no 3.x version ever had it. Its registry
# integrity matches the lockfile's, which held it before this policy. It
# blocked eslint-config-next 16.4.0 on Oct 13 2026 (owner's call to exempt).
trustPolicyExclude:
  - 'semver@6.3.1'
  - 'eslint-import-resolver-typescript@3.10.1'
blockExoticSubdeps: true
