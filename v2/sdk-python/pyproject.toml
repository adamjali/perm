[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "permtracker"
version = "0.1.0"
description = "The PERM Tracker API from Python and the command line: DOL case status, decision estimates, the PERM queue, visa bulletins, and employer, law firm and occupation records."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["perm", "dol", "immigration", "green card", "visa bulletin", "h-1b"]
dependencies = []

[project.urls]
Homepage = "https://permtracker.app/developers"

[project.scripts]
permtracker = "permtracker.cli:main"

[tool.setuptools]
packages = ["permtracker"]
