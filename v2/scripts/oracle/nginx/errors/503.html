<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="15">
<title>Busy for a moment | PERM Tracker</title>
<style>
:root{--bg:#fafafa;--fg:#141414;--card:#fff;--soft:#5e5e5e;--lime:#2ecc40;--ink:#166b25;--edge:#141414}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f0f;--fg:#f2f2f2;--card:#1b1b1b;--soft:#bdbdbd;--ink:#6fe07c;--edge:#8a8a8a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#141414;color:#fff;border-bottom:2px solid #000;padding:14px 20px;font-weight:700;font-size:1.05rem}
header b{color:var(--lime)}
.wrap{flex:1;display:grid;place-items:center;padding:24px 16px}
main{max-width:34rem;width:100%;background:var(--card);border:2px solid var(--edge);box-shadow:6px 6px 0 var(--edge);padding:28px 24px}
.mark{display:inline-grid;place-items:center;width:44px;height:44px;background:#e8a33d;border:2px solid #000;color:#000;font-weight:800;font-size:1.4rem;margin-bottom:14px}
h1{margin:0 0 8px;font-size:1.6rem;line-height:1.2}
p{margin:0 0 18px;color:var(--soft)}
a.go{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;background:var(--lime);color:#000;font-weight:700;text-decoration:none;border:2px solid #000;box-shadow:3px 3px 0 #000}
a.go:active{box-shadow:none;transform:translate(2px,2px)}
@media (prefers-reduced-motion:reduce){a.go:active{transform:none}}
</style>
</head>
<body>
<header><b>PERM</b> Tracker</header>
<div class="wrap">
<main>
<div class="mark" aria-hidden="true">!</div>
<h1>Busy for a moment</h1>
<p>The site is building a lot of pages at once. This one will load again by itself in about 15 seconds.</p>
<p><a class="go" href="">Load it now</a></p>
</main>
</div>
<img src="/__pt/busy-seen?k=503" alt="" width="1" height="1" style="position:absolute;left:-9999px">
</body>
</html>
