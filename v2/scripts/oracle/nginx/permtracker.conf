# PERM Tracker front door. Only cloudflared (on this machine) connects here.
# Cloudflare puts the visitor's address in CF-Connecting-IP; everything below
# keys on that, and X-Real-IP / X-Forwarded-For are OVERWRITTEN for the app,
# so a client-sent value can never reach it.
set_real_ip_from 127.0.0.1;
real_ip_header CF-Connecting-IP;

# A Cloudflare Transform Rule stamps x-pt-verified-bot with Cloudflare's own
# verified-crawler verdict on every request (overwriting any client value).
# Verified crawlers (Googlebot, Bingbot...) skip the per-address limits here
# (they crawl from many addresses) and get their own below, and so do the
# site's own audit scripts, which send x-permtracker-audit
# with the key from .env.local (Vercel's rule 5). The key is a secret, so it
# lives only in /etc/nginx/permtracker-audit-key.conf (root, 600), which
# defines $pt_audit as 1 when the header carries it; this file never names it.
include /etc/nginx/permtracker-audit-key.conf;
map "$http_x_pt_verified_bot:$pt_audit" $pt_key { "~^true:" ""; "~:1$" ""; default $binary_remote_addr; }
map $arg_case $pt_lookup_key { "" ""; default $pt_key; }

# The per-page limits Vercel's firewall used to enforce (rules 3, 4 and 6).
limit_req_zone $pt_key        zone=pt_pages:20m  rate=300r/m;
limit_req_zone $pt_key        zone=pt_api:10m    rate=60r/m;
limit_req_zone $pt_lookup_key zone=pt_lookup:10m rate=20r/m;
limit_req_status 429;

# VERIFIED CRAWLERS, LIMITED BY NAME AND TOGETHER (Sep 29 2026). They used to
# skip every limit, which was right on Vercel (it scaled out per request) and
# wrong on one 2-CPU server: YandexBot at 12:43 AM EDT and PerplexityBot at
# 7:19 AM asked for up to 280 employer pages a minute, each page runs about
# 15 reads over one employer's filings, and the reads queued past the app's
# 20-second deadline. 1,742 employer pages answered 500 that day (Sentry
# JAVASCRIPT-NEXTJS-4T). A 429 tells a crawler to slow down (Google treats it
# like a 503); a 500 tells it the page is broken. Each crawler is one client
# however many addresses it uses, keyed on the name in its user agent; the
# shared zone caps them all at once, so three crawlers bursting together
# still fit. 60 a minute is 86,400 pages a day per crawler, far above any
# one's daily volume here (Googlebot fetched 1,464 pages that day).
map "$http_x_pt_verified_bot:$http_user_agent" $pt_bot_key {
    "~*^true:.*?(?<bot>[a-z0-9_.-]*(bot|spider|crawler|agent|fetcher|externalhit)[a-z0-9_.-]*)" $bot;
    "~^true:"  verified;
    default    "";
}
map $pt_bot_key $pt_bots_all { "" ""; default all; }
limit_req_zone $pt_bot_key  zone=pt_bot:1m  rate=60r/m;
limit_req_zone $pt_bots_all zone=pt_bots:1m rate=120r/m;

upstream permtracker_app {
    include /etc/nginx/permtracker-active-upstream.conf;
    keepalive 32;
}

# Cloudflare keeps a copy of a page near visitors only when the site itself
# marks the page shareable (Next sends "s-maxage" on those; private or no-store
# on everything personal or live). Next's own windows run from 6 hours to a
# year, so the edge gets a SHORT label of its own instead: fresh for 10
# minutes, then served while Cloudflare refreshes it in the background
# (asynchronous stale-while-revalidate, Cloudflare changelog 2026-02-26). A
# refreshed page shows at the edge within about 10 minutes, with no purge key.
# Cloudflare reads Cloudflare-CDN-Cache-Control ahead of Cache-Control, and
# browsers never see it. Which hosts and paths may be stored at all, and the
# bypass for anyone signed in, is the Cloudflare Cache Rule.
map $upstream_http_cache_control $pt_cdn_cc {
    default                               "";
    "~*(private|no-store|no-cache)"       "";
    "~*s-maxage"                          "max-age=600, stale-while-revalidate=3600";
}

# Only the site's own name may be indexed; any other hostname that reaches
# this server (a tunnel address, a stray DNS record) is served noindex.
map $host $pt_robots { permtracker.app ""; default "noindex, nofollow"; }

server {
    listen 127.0.0.1:8081 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffering off;
    proxy_read_timeout 120s;
    add_header X-Robots-Tag $pt_robots always;
    add_header Cloudflare-CDN-Cache-Control $pt_cdn_cc;

    # Hashed build files from EVERY recent release, so a visitor mid-session
    # during a deploy still gets the chunks their page asks for.
    location /_next/static/ {
        root /srv/permtracker/app/shared;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag $pt_robots always;
        try_files $uri @app;
    }
    # Everything else Next serves under /_next/ (resized images, page data) is
    # part of showing a page, not a page view; Vercel's page limit excluded it.
    location /_next/ {
        proxy_pass http://permtracker_app;
    }
    location /api/ {
        limit_req zone=pt_api burst=30 nodelay;
        proxy_pass http://permtracker_app;
    }
    location = /perm-case-status {
        limit_req zone=pt_lookup burst=10 nodelay;
        limit_req zone=pt_pages burst=100 nodelay;
        proxy_pass http://permtracker_app;
    }
    location = /embed/case-status {
        limit_req zone=pt_lookup burst=10 nodelay;
        limit_req zone=pt_pages burst=100 nodelay;
        proxy_pass http://permtracker_app;
    }
    location / {
        limit_req zone=pt_pages burst=100 nodelay;
        limit_req zone=pt_bot burst=30 nodelay;
        limit_req zone=pt_bots burst=60 nodelay;
        error_page 429 = @pt_slow_down;
        proxy_pass http://permtracker_app;
    }
    location @app { proxy_pass http://permtracker_app; }
    # A limited request gets a minute's pause to wait out, in the header
    # crawlers read.
    location @pt_slow_down {
        add_header Retry-After 60 always;
        add_header X-Robots-Tag $pt_robots always;
        return 429;
    }
}
