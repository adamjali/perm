# PERM Tracker front door. Only cloudflared (on this machine) connects here.
# Cloudflare puts the visitor's address in CF-Connecting-IP; everything below
# keys on that, and X-Real-IP / X-Forwarded-For are OVERWRITTEN for the app,
# so a client-sent value can never reach it.
set_real_ip_from 127.0.0.1;
real_ip_header CF-Connecting-IP;

# HOW THE LIMITS ARE SHAPED (Sep 29 2026, owner: "lax broad limits everywhere;
# performance and experience first"). Measured on this 2-CPU server: a cached
# page answers in about 10 ms, a page built from scratch in 0.1 to 2.6 s
# (about one a second is all it can build). So SPEED is limited by how many
# requests are inside the app at once, which adapts to how expensive they are,
# and the per-minute rates are set high enough that no person ever meets them.
# A person over a rate is SLOWED first (nginx's two-stage limit_req: the
# requests past `delay` wait their turn instead of failing; waiting requests
# do not count toward the in-flight caps, tested Sep 29), and only a client far
# past it gets a page that reloads itself. Crawlers are refused at once with
# Retry-After, which is how they are told to slow down.

# A Cloudflare Transform Rule stamps x-pt-verified-bot with Cloudflare's own
# verified-crawler verdict on every request (overwriting any client value).
# Verified crawlers skip the per-address limits (they crawl from many
# addresses) and get their own below, and so do the site's own audit scripts,
# which send x-permtracker-audit with the key from .env.local. The key is a
# secret, so it lives only in /etc/nginx/permtracker-audit-key.conf (root,
# 600), which defines $pt_audit as 1 when the header carries it.
include /etc/nginx/permtracker-audit-key.conf;
map "$http_x_pt_verified_bot:$pt_audit" $pt_key { "~^true:" ""; "~:1$" ""; default $binary_remote_addr; }

# BACKGROUND PRE-LOADS. Next's router loads a linked page ahead of the click
# and marks the request `next-router-prefetch: 1`. Measured Sep 29 on the live
# app: a pre-load of a case page answered in 0.18 s with the loading shell and
# never asked DOL (the live-lookup counter did not move); the click did.
# Counting pre-loads against a reader's page and lookup limits refused 24 of
# them in one hour and protected nothing, so they have their own, higher
# allowance and never touch the lookup limit. The in-flight cap still bounds
# what any one address can make the app build.
map $http_next_router_prefetch $pt_page_key     { "1" "";      default $pt_key; }
map $http_next_router_prefetch $pt_prefetch_key { "1" $pt_key; default ""; }
map $arg_case $pt_has_case { "" 0; default 1; }
map "$pt_has_case:$http_next_router_prefetch" $pt_lookup_key {
    "1:1"   "";
    "~^1:"  $pt_key;
    default "";
}

# Per address (people). 600 pages a minute is 10 a second, sustained; the
# first 150 over that answer at once, the next 150 wait (at most 15 s), and
# only then does the self-reloading page appear. Measured Sep 29: no person
# reached the old 300 in a day. Case lookups are the one page that can ask DOL
# live; DOL's own allowance is guarded by the site-wide daily budget in the
# app, so this only slows one address running a script.
# CASE LOOKUPS TOGETHER. A lookup is the most expensive page here (it can ask
# DOL live), and rotating addresses get round every per-address limit: on
# Oct 2 2026 at 12:12 AM EDT a scraper sent 137 lookups in one minute from about
# 200 addresses, the app's 64 in-flight slots filled, and people asking for
# ordinary pages were turned away. So lookups from everyone together may hold
# at most 24 of those slots; past that a lookup gets the page that retries by
# itself, and every other page keeps its room. Pre-loads are not lookups.
map "$pt_has_case:$http_next_router_prefetch" $pt_lookup_all {
    "1:1"   "";
    "~^1:"  lookups;
    default "";
}
limit_conn_zone $pt_lookup_all zone=pt_lookup_conn:1m;

# ONE FROZEN BROWSER LABEL (Oct 7 2026). From Oct 6, 8:27 PM EDT a scraper on
# residential proxies walked case numbers under one exact label, Windows Chrome
# 151.0.0.0: 4,043 of the 4,063 lookups in 15 minutes, from 2,153 addresses,
# with both web copies at 90% CPU and people shown the busy page. It passes
# Cloudflare's checks (custom rules 4 and 5 were on throughout), so the limit
# has to be here. Chrome updates itself every four weeks, and the people looking
# up cases that night reported 152 and 154. Lookups under this exact label,
# together, get 30 a minute; past that, the page that retries by itself. Any
# other label, and any page that isn't a lookup, is untouched.
map "$pt_lookup_all:$http_user_agent" $pt_stale_label {
    # A pattern, not a plain string: a key this long overflows nginx's map
    # hash (map_hash_bucket_size 64), which refused the first reload.
    "~^lookups:Mozilla/5\.0 \(Windows NT 10\.0; Win64; x64\) AppleWebKit/537\.36 \(KHTML, like Gecko\) Chrome/151\.0\.0\.0 Safari/537\.36$" stale;
    default "";
}
limit_req_zone $pt_stale_label zone=pt_stale_label:1m rate=30r/m;

# THE PUBLIC API AND THE MCP SERVER (Oct 2 2026). The app holds each key to its
# plan, a minute, a day and a month (src/lib/api/). nginx keeps the server's
# share: /v1 calls together hold at most 24 of the app's 64 slots, so a burst
# of them can't crowd out people reading pages. /mcp keeps its own cap instead
# of the app's: an assistant may hold a notification stream open for hours,
# which costs no CPU and must not hold a render slot. Its tool calls are short
# reads; 48 at once across the site, and the app refuses more than 8 open
# streams per copy.
limit_conn_zone $pt_app_all zone=pt_apiall:1m;
limit_conn_zone $pt_app_all zone=pt_mcpall:1m;

limit_req_zone $pt_page_key     zone=pt_page:20m    rate=600r/m;
limit_req_zone $pt_prefetch_key zone=pt_prefetch:20m rate=1200r/m;
limit_req_zone $pt_lookup_key   zone=pt_lookup:10m   rate=120r/m;
limit_req_zone $pt_key          zone=pt_api:10m      rate=240r/m;
limit_req_status 429;

# Verified crawlers, by name and together. They are not exempt from limits:
# on one 2-CPU server a single crawler asking for hundreds of employer pages a
# minute queues renders past the app's deadline and turns them into 500s. A
# 429 tells a crawler to slow down (Google treats it like a 503); a 500 tells
# it the page is broken.
#
# Search engines (Google's and Microsoft's crawlers) have their own allowance
# and are NOT in the shared pool, so a busy AI crawler can never use theirs up.
# Measured busiest minutes on Sep 29: Googlebot 31, Bingbot 70. Everyone else
# is keyed on the name in its user agent and shares one pool.
map $http_user_agent $pt_search_family {
    "~*(googlebot|google-inspectiontool|googleother|storebot-google|google-safety|adsbot-google|mediapartners-google)" google;
    "~*(bingbot|bingpreview|adidxbot|msnbot)" bing;
    default "";
}
map "$http_x_pt_verified_bot:$pt_search_family" $pt_search_key { "~^true:(?<f>.+)$" $f; default ""; }
map "$http_x_pt_verified_bot:$pt_search_family:$http_user_agent" $pt_bot_key {
    "~^true:[a-z]+:"  "";
    "~*^true::.*?(?<bot>[a-z0-9_.-]*(bot|spider|crawler|agent|fetcher|externalhit)[a-z0-9_.-]*)" $bot;
    "~^true::"  verified;
    default    "";
}
map $pt_bot_key $pt_bots_all { "" ""; default all; }
limit_req_zone $pt_search_key zone=pt_search:1m rate=180r/m;
limit_req_zone $pt_bot_key    zone=pt_bot:1m    rate=90r/m;
limit_req_zone $pt_bots_all   zone=pt_bots:1m   rate=180r/m;
# Meta's AI crawler gets 30 a minute, a third of the others (owner's call, Oct 2
# 2026). Measured that night: it was the biggest load that wasn't a person, a
# median 73 pages a minute (peaks 133) from 110 addresses, mostly employer pages
# nobody had visited, each built from scratch. It still reads every page, more
# slowly. 30 is what Vercel's rule allowed it until Sep 28.
map $pt_bot_key $pt_meta_key { "meta-externalagent" meta; default ""; }
limit_req_zone $pt_meta_key   zone=pt_meta:1m   rate=30r/m;

# IN FLIGHT AT ONCE. The whole app: 64 (on two CPUs, builds that pile up only
# get slower; on Sep 29 a pile-up made the live copy stop answering for six
# minutes until the watchdog restarted it). One address: 32, so no single
# client can take the app; Next's router runs at most 4 background pre-loads
# at once per browser (12 for a hovered link, segment-cache/scheduler.js), so
# 32 leaves room for several people sharing one address (an office, a campus,
# a mobile carrier) and still keeps a script to half the app. Search
# engines together: 6, other crawlers together: 4, so crawlers can never hold
# the slots people need. Files nginx serves from disk do not count, and
# requests waiting in a slow-down do not count either.
map $host $pt_app_all { default app; }
map $pt_search_key $pt_search_all { "" ""; default search; }
limit_conn_zone $pt_app_all    zone=pt_app:1m;
limit_conn_zone $pt_key        zone=pt_perip:10m;
limit_conn_zone $pt_search_all zone=pt_search_conn:1m;
limit_conn_zone $pt_bots_all   zone=pt_bots_conn:1m;
limit_conn_status 503;

# TWO COPIES OF THE LIVE RELEASE, ONE PER CPU (Oct 2 2026). Node renders on one
# core, so a single copy saturated at two or three times normal traffic while
# the second core idled. The deploy runs the live release twice (blue on 3001
# and 3011, green on 3002 and 3012; see permtracker-deploy) and writes:
#   permtracker-active-upstream.conf  both copies, and `hash ... consistent`
#   permtracker-active-w1.conf        the first copy alone
#   permtracker-active-w2.conf        the second copy alone
# The hash key is the page's path and query WITHOUT Next's `_rsc` token, so a
# page, its pre-load and its data request all reach the same copy and are built
# and cached once; different pages and different case numbers spread over both.
map $args $pt_args_no_rsc {
    "~^_rsc=[^&]*&?(?<b>.*)$"            $b;
    "~^(?<a>.*)&_rsc=[^&]*(?<b>.*)$"    "$a$b";
    default                             $args;
}
# keepalive_timeout 4s: Node closes an idle connection after 5 s (Next's
# server.js keeps Node's default), and nginx's own default is 60 s, so nginx
# kept reusing connections Node had just closed: hundreds of "Connection reset
# by peer" a day and about 0.06% of requests answered 502 (Oct 2 2026). The
# side that closes first must be nginx. Next's docs: Node's timeout must be
# longer than the proxy's.
upstream permtracker_app {
    include /etc/nginx/permtracker-active-upstream.conf;
    keepalive 32;
    keepalive_timeout 4s;
}
upstream permtracker_w1 {
    include /etc/nginx/permtracker-active-w1.conf;
    keepalive 4;
    keepalive_timeout 4s;
}
upstream permtracker_w2 {
    include /etc/nginx/permtracker-active-w2.conf;
    keepalive 4;
    keepalive_timeout 4s;
}

# The analytics relay looks PostHog up at request time: its hosts sit behind
# Amazon load balancers whose addresses change, and an address fixed at reload
# goes stale (PostHog issue 40619). Assets come from the assets host.
map $uri $pt_posthog_host {
    "~^/ingest/(static|array)/"  us-assets.i.posthog.com;
    default                      us.i.posthog.com;
}

# Cloudflare keeps a copy of a page near visitors only when the site itself
# marks the page shareable (Next sends "s-maxage" on those; private or no-store
# on everything personal or live). Next's own windows run from 6 hours to a
# year, so the edge gets a SHORT label of its own instead: fresh for 10
# minutes, then served while Cloudflare refreshes it in the background
# (asynchronous stale-while-revalidate, Cloudflare changelog 2026-02-26). A
# refreshed page shows at the edge within about 10 minutes, with no purge key.
# Cloudflare reads Cloudflare-CDN-Cache-Control ahead of Cache-Control, and
# browsers never see it. Which hosts and paths may be stored at all, and the
# bypass for anyone signed in, is the Cloudflare Cache Rule. Next's `_rsc`
# token is a hash of the router headers, so a background pre-load and a full
# page never share a cache key.
map $upstream_http_cache_control $pt_cdn_cc {
    default                               "";
    "~*(private|no-store|no-cache)"       "";
    "~*s-maxage"                          "max-age=600, stale-while-revalidate=3600, stale-if-error=86400";
}
# stale-if-error (Oct 2 2026): when the server answers 5xx (busy, or a copy
# restarting), Cloudflare serves the last good copy for up to a day instead of
# the error. It fires on 5xx only, which is why the app's busy answer is a 503.
# Always Online is off on purpose: Cloudflare ignores stale-while-revalidate and
# stale-if-error when it's on.

# Only the site's own name may be indexed; any other hostname that reaches
# this server (a tunnel address, a stray DNS record) is served noindex.
map $host $pt_robots { permtracker.app ""; default "noindex, nofollow"; }

# PEOPLE SHOWN A REFUSAL (Oct 2 2026). Both refusal pages carry a 1-pixel
# image, /__pt/busy-seen, and only a browser that draws the page asks for it,
# so this log counts people who saw "busy" or "one moment", not the scripts
# turned away. bin/permtracker-health counts it every 10 minutes and the
# morning report prints the week: when it climbs, the server is too small.
# Its own folder (root:permtracker 750) and rotation
# (conf/logrotate-permtracker-busy), so the health check can read it without
# the adm group that every other log needs. A page reloads itself every 10 to
# 15 s, so 6 a minute per address is a person waiting; more is spam, refused
# and kept out of this log.
log_format pt_busy_seen '$time_iso8601 $status $remote_addr $arg_k "$http_user_agent"';
limit_req_zone $binary_remote_addr zone=pt_busy_seen:1m rate=6r/m;

# What bin/permtracker-defend reads every minute: each request's status, the
# network it came from (x-pt-asn, set by a Cloudflare transform rule from
# ip.src.asnum, overwriting anything a client sends), whether Cloudflare
# verified it as a crawler, the path and the browser label. Same folder and
# rotation as the busy log (conf/logrotate-permtracker-busy); two days kept.
log_format pt_defend '$msec $status $http_x_pt_asn $http_x_pt_verified_bot "$uri" "$http_user_agent"';

server {
    listen 127.0.0.1:8081 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    # Both logs at this level: an access_log here replaces the one inherited
    # from nginx.conf, so the main log is named again or it would stop.
    access_log /var/log/nginx/access.log;
    access_log /var/log/permtracker-busy/defend.log pt_defend buffer=64k flush=5s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffering off;
    # 300 s (was 120, Sep 29 2026): the nightly scorecard job may run 300 s,
    # and a streamed chat answer can take minutes.
    proxy_read_timeout 300s;
    add_header X-Robots-Tag $pt_robots always;
    add_header Cloudflare-CDN-Cache-Control $pt_cdn_cc;

    # The same two pages for a refusal everywhere. The caps are repeated in
    # every proxied location on purpose: nginx drops an inherited limit_conn
    # or limit_req as soon as a location sets one of its own. Files served
    # from disk carry none (scripts/oracle/test_nginx_conf.py checks both).
    error_page 503 @pt_busy;
    error_page 429 @pt_slow_down;

    # The refusal pages' counting image (see pt_busy_seen above). Served by
    # nginx itself, never the app, so it answers while the app is full.
    # empty_gif, not `return`: a return answers before limit_req runs, so the
    # limit never applied (measured: 8 quick hits from one address, 8 logged).
    location = /__pt/busy-seen {
        limit_req zone=pt_busy_seen burst=5 nodelay;
        access_log /var/log/permtracker-busy/seen.log pt_busy_seen;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
        empty_gif;
    }

    # The watchdog's check on nginx itself, answered by nginx alone. It used to
    # ask for the app's health THROUGH nginx, so a full app (nginx's instant
    # 503 "busy" reply) read as nginx being down: on Oct 3 2026 at 3:16 PM EDT
    # that restarted nginx in the middle of a deploy and dropped the site for
    # about 5 seconds. No limits, no logging; it says only that nginx answers.
    location = /__pt/nginx-alive {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
        return 204;
    }

    # Hashed build files from EVERY recent release, so a visitor mid-session
    # during a deploy still gets the chunks their page asks for.
    location /_next/static/ {
        root /srv/permtracker/app/shared;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag $pt_robots always;
        try_files $uri @app;
    }
    # Everything else Next serves under /_next/ (resized images, page data) is
    # part of showing a page, not a page view; only the whole-app cap applies.
    location /_next/ {
        limit_conn pt_app 64;
        proxy_pass http://permtracker_app;
    }
    # The public/ folders (images, social cards, animations, portraits) straight
    # from the serving release on disk (deploy keeps $A/live pointing at it).
    # A day at Cloudflare's edge, a week served stale while it refreshes; a
    # file not on disk falls through to Next as before.
    location ~ ^/(images|og|lottie|about|agency)/ {
        root /srv/permtracker/app/live/public;
        try_files $uri @app;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag $pt_robots always;
    }
    # The icons every visit asks for (the service worker too), from disk, a
    # day at the edge and in browsers. Next served them with max-age=0, so in 5
    # hours (Oct 2 2026) about 1,800 requests went through the app for
    # unchanged icons, and some were refused under the page limits. sw.js stays
    # with the app on purpose: a worker's security policy comes from its own
    # response headers, which Next sets and this file doesn't.
    location ~ ^/(favicon\.ico|icon-192\.png|icon-512\.png|icon\.svg|badge-72\.png|apple-touch-icon\.png)$ {
        root /srv/permtracker/app/live/public;
        try_files $uri @app;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag $pt_robots always;
    }
    # ANALYTICS RELAY (Oct 2 2026). posthog-js posts to /ingest on our own
    # domain. Next relayed it until now, which put every analytics request
    # through the one process that builds pages, and each relayed request
    # stacked eleven close listeners on its response (Next's relay, compression
    # and Sentry's request tracking), so Node logged "MaxListenersExceeded"
    # about 1,500 times an hour and buried real errors. nginx relays it now, as
    # PostHog documents: the visitor's address in X-Forwarded-For (PostHog's
    # cookie-free counting and its country lookup read it; sending ours would
    # make every visitor one person), the PostHog host as Host, and no cookies
    # or credentials. Next's rewrite stays as the fallback it never reaches.
    location ^~ /ingest/ {
        limit_conn pt_perip 32;
        limit_req zone=pt_api burst=200 delay=120;
        resolver 127.0.0.53 valid=60s ipv6=off;
        resolver_timeout 5s;
        rewrite ^/ingest/(.*)$ /$1 break;
        proxy_pass https://$pt_posthog_host;
        proxy_ssl_server_name on;
        proxy_ssl_name $pt_posthog_host;
        proxy_set_header Host $pt_posthog_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
    # EMAIL LINKS (Oct 2 2026): preferences, one-click unsubscribe, and every
    # alert's confirm and unsubscribe, and a law firm's claim links (Oct 2026).
    # The pages are served by our Convex
    # backend; Next relayed them (an external rewrite in next.config.ts) and
    # each relayed request put 11 close listeners on Node's response, the last
    # MaxListenersExceededWarning after the analytics move. nginx relays them
    # straight there now, so they also answer while the app is full.
    #   - Only the headers the backend needs: Cloudflare's own (CF-Connecting-IP
    #     and friends) must not reach another Cloudflare zone, which refuses or
    #     misreads them. The visitor's address goes in X-Forwarded-For, as Next
    #     sent it.
    #   - Never stored: the backend sends no Cache-Control, so Cloudflare's
    #     cache rule kept these pages up to 2 hours, and reopening a preferences
    #     link could show settings the person had already changed.
    #   - Not framed, no referrer: the URLs carry each person's token.
    # Next keeps its rewrites as a fallback nothing reaches.
    location ~ ^/(prefs(/.*)?|unsubscribe|(queue|case|bulletin|employer)-alert/.*|firm-claim/.*)$ {
        limit_conn pt_perip 32;
        limit_req zone=pt_api burst=200 delay=120;
        resolver 127.0.0.53 valid=60s ipv6=off;
        resolver_timeout 5s;
        set $pt_convex_site giant-dragon-464.convex.site;
        proxy_pass https://$pt_convex_site;
        proxy_ssl_server_name on;
        proxy_ssl_name $pt_convex_site;
        proxy_pass_request_headers off;
        proxy_set_header Host $pt_convex_site;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Accept $http_accept;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    # REFRESH BOTH COPIES. A refresh call (revalidatePath) marks pages stale in
    # the memory of the copy that receives it, and each copy keeps its own, so
    # the call goes to the first copy and nginx sends the same request, body and
    # secret, to the second (`mirror`; its answer is discarded).
    location ~ ^/api/revalidate- {
        error_page 429 @pt_slow_down_api;
        error_page 503 @pt_busy_api;
        limit_conn pt_app 64;
        limit_conn pt_perip 32;
        limit_conn pt_search_conn 6;
        limit_conn pt_bots_conn 4;
        limit_req zone=pt_api burst=200 delay=120;
        limit_req zone=pt_search burst=120 nodelay;
        limit_req zone=pt_bot burst=45 nodelay;
        limit_req zone=pt_meta burst=15 nodelay;
        limit_req zone=pt_bots burst=90 nodelay;
        mirror /__pt_revalidate_w2;
        mirror_request_body on;
        proxy_pass http://permtracker_w1;
    }
    # The mirror's answer is ignored, and a slow one holds up the next request
    # on its connection, so it gets 30 s rather than the 300 s page timeout.
    location = /__pt_revalidate_w2 {
        internal;
        proxy_read_timeout 30s;
        proxy_pass http://permtracker_w2$request_uri;
    }
    location /api/ {
        # The site's own code reads /api answers as JSON, so a refusal here is
        # JSON too (same status, same Retry-After), never the HTML page.
        error_page 429 @pt_slow_down_api;
        error_page 503 @pt_busy_api;
        limit_conn pt_app 64;
        limit_conn pt_perip 32;
        limit_conn pt_search_conn 6;
        limit_conn pt_bots_conn 4;
        limit_req zone=pt_api burst=200 delay=120;
        limit_req zone=pt_search burst=120 nodelay;
        limit_req zone=pt_bot burst=45 nodelay;
        limit_req zone=pt_meta burst=15 nodelay;
        limit_req zone=pt_bots burst=90 nodelay;
        proxy_pass http://permtracker_app;
    }
    location ~ ^/v1(/|$) {
        error_page 429 @pt_slow_down_api;
        error_page 503 @pt_busy_api;
        limit_conn pt_app 64;
        limit_conn pt_apiall 24;
        limit_conn pt_perip 32;
        limit_conn pt_search_conn 6;
        limit_conn pt_bots_conn 4;
        limit_req zone=pt_api burst=200 delay=120;
        limit_req zone=pt_search burst=120 nodelay;
        limit_req zone=pt_bot burst=45 nodelay;
        limit_req zone=pt_meta burst=15 nodelay;
        limit_req zone=pt_bots burst=90 nodelay;
        proxy_pass http://permtracker_app;
    }
    # Assistants' tool calls are not crawling, so the crawler pools don't apply;
    # calls without a key share the app's own pool (src/lib/api/mcp.ts).
    location = /mcp {
        error_page 429 @pt_slow_down_api;
        error_page 503 @pt_busy_api;
        limit_conn pt_mcpall 48;
        limit_conn pt_perip 32;
        limit_req zone=pt_api burst=200 delay=120;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_pass http://permtracker_app;
    }
    location = /perm-case-status {
        limit_conn pt_app 64;
        limit_conn pt_lookup_conn 24;
        limit_conn pt_perip 32;
        limit_conn pt_search_conn 6;
        limit_conn pt_bots_conn 4;
        limit_req zone=pt_lookup burst=100 delay=60;
        limit_req zone=pt_stale_label burst=10 nodelay;
        limit_req zone=pt_page burst=300 delay=150;
        limit_req zone=pt_prefetch burst=600 nodelay;
        limit_req zone=pt_search burst=120 nodelay;
        limit_req zone=pt_bot burst=45 nodelay;
        limit_req zone=pt_meta burst=15 nodelay;
        limit_req zone=pt_bots burst=90 nodelay;
        proxy_pass http://permtracker_app;
    }
    location = /embed/case-status {
        limit_conn pt_app 64;
        limit_conn pt_lookup_conn 24;
        limit_conn pt_perip 32;
        limit_conn pt_search_conn 6;
        limit_conn pt_bots_conn 4;
        limit_req zone=pt_lookup burst=100 delay=60;
        limit_req zone=pt_stale_label burst=10 nodelay;
        limit_req zone=pt_page burst=300 delay=150;
        limit_req zone=pt_prefetch burst=600 nodelay;
        limit_req zone=pt_search burst=120 nodelay;
        limit_req zone=pt_bot burst=45 nodelay;
        limit_req zone=pt_meta burst=15 nodelay;
        limit_req zone=pt_bots burst=90 nodelay;
        proxy_pass http://permtracker_app;
    }
    location / {
        limit_conn pt_app 64;
        limit_conn pt_perip 32;
        limit_conn pt_search_conn 6;
        limit_conn pt_bots_conn 4;
        limit_req zone=pt_page burst=300 delay=150;
        limit_req zone=pt_prefetch burst=600 nodelay;
        limit_req zone=pt_search burst=120 nodelay;
        limit_req zone=pt_bot burst=45 nodelay;
        limit_req zone=pt_meta burst=15 nodelay;
        limit_req zone=pt_bots burst=90 nodelay;
        proxy_pass http://permtracker_app;
    }
    location @app { proxy_pass http://permtracker_app; }

    # A refusal keeps its real status and its Retry-After (crawlers read
    # those), and a person sees a small page that reloads itself. A click
    # whose data request is refused falls back to a full load and lands here
    # too. Never cached: Cache-Control no-store, and the edge only keeps what
    # the site marks shareable.
    location @pt_busy {
        root /etc/nginx/permtracker-errors;
        try_files /503.html =503;
        charset utf-8;
        add_header Retry-After 15 always;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag $pt_robots always;
    }
    location @pt_busy_api {
        default_type application/json;
        add_header Retry-After 15 always;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag $pt_robots always;
        return 503 '{"error":"busy","message":"The site is busy for a moment. Try again in about 15 seconds.","retryAfter":15}';
    }
    location @pt_slow_down_api {
        default_type application/json;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag $pt_robots always;
        return 429 '{"error":"rate_limited","message":"Too many requests from this address. Try again in a few seconds.","retryAfter":30}';
    }
    location @pt_slow_down {
        root /etc/nginx/permtracker-errors;
        try_files /429.html =429;
        charset utf-8;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag $pt_robots always;
    }
}
