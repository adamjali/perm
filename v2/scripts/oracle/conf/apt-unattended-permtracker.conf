// /etc/apt/apt.conf.d/52unattended-upgrades-permtracker
// Also keep the two third-party packages the site runs on patched: the
// Cloudflare tunnel and Node.js (pinned to the 24.x line by its repository, so
// only patch and minor releases arrive). needrestart then restarts whatever was
// running the old binary (see needrestart-auto.conf).
Unattended-Upgrade::Origins-Pattern {
        "site=pkg.cloudflare.com";
        "site=deb.nodesource.com";
};
