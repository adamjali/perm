# /etc/systemd/system/permtracker-web@.service.d/resources.conf
# Each website copy: Node's heap is capped at 2.5 GB (NODE_OPTIONS), and past
# 3 GB the kernel squeezes the process before 3.5 GB stops it outright, so a
# runaway render restarts one copy (systemd brings it back in 2 seconds)
# instead of pushing the database into swap. Measured Sep 29 2026: about
# 1.1 GB each in normal service. Second in line for CPU after the database.
[Service]
MemoryHigh=3G
MemoryMax=3584M
OOMScoreAdjust=200
CPUWeight=200
# Node exits 143 when systemd stops it (SIGTERM), which systemd otherwise
# records as a failure: the old slot's second copy, stopped by every deploy,
# read "failed" and would warn in the morning report (Oct 2 2026). Restart is
# "always", so an unexpected exit still brings the copy back.
SuccessExitStatus=143
