# /etc/systemd/system/<unit>.service.d/resources.conf for Performance Co-Pilot:
# pmcd, pmlogger, pmlogger_daily, pmlogger_farm. PCP 7.1.1 was installed from
# Cockpit on Sep 29 2026 so the panel can show metrics history; it records
# numbers once a minute (about 50 MB of memory together, measured that night)
# and keeps 14 days of archives (pmlogger_daily's CULLAFTER_DEFAULT). These
# yield CPU and disk to visitors and the database and are killed before
# anything that serves the site. pmcd listens on localhost only; pmproxy
# (Cockpit's "Export to network") and pmie (alert rules) are disabled.
# They restart forever, a minute apart. PCP ships Restart=always with systemd's
# default limit of five starts in ten seconds and a 100 ms pause, so when the
# disk filled on Oct 10 2026 pmlogger tried five times in half a second, hit the
# limit and stayed down for a day (metrics history lost from 5:31 AM EDT Oct 10
# to 8:58 AM EDT Oct 11). The morning report also lists any service left
# stopped after an error (permtracker-health, stoppedUnits).
[Unit]
StartLimitIntervalSec=0

[Service]
RestartSec=60
CPUWeight=10
IOWeight=10
MemoryHigh=256M
MemoryMax=512M
OOMScoreAdjust=600
