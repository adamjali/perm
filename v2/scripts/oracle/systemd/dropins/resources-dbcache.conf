# /etc/systemd/system/permtracker-dbcache.service.d/resources.conf
# The RAM lock (vmtouch) holds the 3.3 GB database file in memory that nothing
# else can reclaim. If the machine ever runs short, killing IT is the cheapest
# rescue: the pages become ordinary, reclaimable cache and the database keeps
# running. It restarts itself 30 seconds later. (Sep 29 2026)
[Service]
OOMScoreAdjust=800
