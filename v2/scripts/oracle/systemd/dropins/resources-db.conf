# /etc/systemd/system/permtracker-db.service.d/resources.conf
# The database is the one process that must never be killed for memory: the
# kernel's out-of-memory killer takes the website, a job or the RAM lock first
# (-900 of a -1000..1000 scale), and it wins CPU and disk time over everything
# else when the machine is busy. No memory cap, on purpose. (Sep 29 2026)
[Service]
OOMScoreAdjust=-900
CPUWeight=400
IOWeight=400
# The memory allocator's pools (Nov 1 2026). sqld uses the system's allocator, which keeps up to 8 pools
# per CPU and rarely hands freed memory back: after 11 days sqld held 3.9 GB in memory and 1.6 GB in
# swap, crowding the database file out of the page cache, so cold reads ran 25 times slower (the city
# list 1,357 ms against 54 ms warm). Two pools hold far less; it applies at the next start, and
# permtracker-db-refresh restarts sqld at night once it passes 4 GB anyway. Installed for both databases.
Environment=MALLOC_ARENA_MAX=2
