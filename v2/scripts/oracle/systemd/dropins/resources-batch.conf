# /etc/systemd/system/<job>.service.d/resources.conf for every scheduled job:
# backup, restore-test, uscis@, cron@, health, watchdog.
# Jobs yield CPU and disk to visitors and the database, and none can take the
# machine's memory: peaks measured Sep 29 2026 were 310 MB (backup), about
# 100 MB (USCIS fetches) and 3.1 GB for the restore test, most of it file cache
# the kernel reclaims under MemoryHigh before MemoryMax is ever reached.
[Service]
CPUWeight=25
IOWeight=25
MemoryHigh=3G
MemoryMax=4G
OOMScoreAdjust=500
