version: 2
# Tuesday, not Monday: keeps a Monday free of dependency PRs.
updates:
  # Frontend dependencies (npm) - v2 directory
  - package-ecosystem: "npm"
    directory: "/v2"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Keep @types/node on v24: the server runs Node 24 (engines.node 24.x).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # A Next.js major changes rendering and caching behaviour, so it is
      # upgraded by hand; minors and patches come through here.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      # @sentry/nextjs 10.72 vendored an ESM file into its CJS build that reads
      # `import.meta.url` at load, which Vitest can't resolve: the suite failed
      # on import while the production build was fine. 10.75 runs under Vitest
      # (the full suite passed with it, Oct 24 2026), so v2/package.json pins
      # ~10.75.2 for its critical-advisory fix (GHSA-mchm-gjx6-7h55). A newer
      # version comes in by hand, after the full suite passes with it.
      - dependency-name: "@sentry/nextjs"
        versions: [">=10.76.0"]

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # CodeQL's actions (and Semgrep's upload-sarif) must move together: init
    # writes a config stamped with its own version and the later steps refuse
    # one from another version.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
