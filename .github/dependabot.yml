version: 2
updates:
  # Frontend dependencies (npm) - v2 directory
  - package-ecosystem: "npm"
    directory: "/v2"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "adamjali"
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Keep @types/node on v24 (matches Vercel Node 24 runtime via engines.node)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Ignore next major bumps only — allow minor+patch auto-update.
      # Major bumps (17.x+) require manual review due to RSC/caching behavior changes.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "adamjali"
