version: 2
updates:
  # Frontend dependencies (npm) - v2 directory
  - package-ecosystem: "npm"
    directory: "/v2"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # `reviewers` removed: GitHub retired the option on 2025-05-20 in favour of
    # CODEOWNERS, so it had been dead config here. Not replaced with a
    # CODEOWNERS file, which would add nothing on a single-maintainer repo where
    # the owner is already notified of every PR.
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Keep @types/node on v24 (matches Vercel Node 24 runtime via engines.node)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Ignore next major bumps only — allow minor+patch auto-update.
      # Major bumps (17.x+) require manual review due to RSC/caching behavior changes.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      # @sentry/nextjs 10.72+ stopped depending on
      # @apm-js-collab/code-transformer-bundler-plugins and VENDORS it instead,
      # copying an ESM file that runs `fileURLToPath(import.meta.url)` at module
      # load into its CJS build. Vitest cannot resolve that to a file:// URL, so
      # it throws ERR_INVALID_URL_SCHEME on import: 10.73.0 failed 24 test files
      # and stopped 109 more from ever running. The production webpack build is
      # UNAFFECTED, which is why this is invisible until the suite runs.
      # Pinned to ~10.70.0 in v2/package.json. Drop this rule once upstream
      # ships a build whose vendored copy no longer touches import.meta.url.
      - dependency-name: "@sentry/nextjs"
        versions: [">=10.71.0"]

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
