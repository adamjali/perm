name: Per-case status mirror

# The ONLY source of a PENDING case status, and the table every case-alert
# email reads. DOL's quarterly disclosure files carry a decision date on every
# row, so "what is this case doing right now" is not derivable from them at any
# effort, and flag.dol.gov's own status search is CAPTCHA-gated.
#
# THIS RAN NOWHERE UNTIL NOW. The mirror script existed, was correct, and was
# invoked by no workflow and no cron - so the table sat frozen at whatever the
# last manual run left, while `caseAlerts.sweepCaseChanges` ran on schedule
# against it and faithfully found nothing. An alert product wired to a source
# with no heartbeat reports "no change" forever and looks like it is working.
#
# TWO CADENCES, because the two passes do different jobs:
#
#   PENDING, every 12h (~10 min, 492 pages). Only a non-final case can move,
#   so this covers everything that can change, and it sets the alert latency we
#   can state out loud: at worst about twelve hours behind the upstream, plus
#   whatever their own check lag is.
#
#   WRITES ARE THE BINDING CONSTRAINT, NOT TIME. The loop used to upsert all
#   200 rows of every page whether anything had moved or not: 98,244 writes a
#   pass, ~12M/month against a 10M free-tier ceiling, to store rows that were
#   already identical. `needs_write()` reads before writing and skips the
#   unchanged. Measured over 1,000 live rows across five pages: 87.5% skipped,
#   so a pass is ~12,280 writes rather than 98,244. Two passes a day is about
#   737,000 writes a month - 7% of the ceiling, with room for the corpus to
#   grow several times over.
#
#   FULL, weekly on Sunday (~42 min, 2,082 pages). Picks up cases added to the
#   upstream watchlist since the last sweep, and re-reconciles rows that went
#   final. Weekly rather than daily because a decided case cannot change again
#   and re-reading 315,000 settled rows daily would be rude and pointless.
#
# The two passes checkpoint SEPARATELY (`case_status_pending` vs
# `case_status`), so the weekly full pass cannot rewind the 6-hourly one.
#
# Manual run:
#   cd v2 && python3 scripts/mirror_case_status.py --pending
#   cd v2 && python3 scripts/mirror_case_status.py

# SCHEDULE DISABLED 2026-08-27. Kept dispatchable as a fallback, not deleted.
#
# THE TWO INGESTS WOULD FIGHT. This one reads permtrack's copy; the direct
# one reads DOL. permtrack's data is a quarter stale, so after the direct
# sweep corrected 1,328 statuses from the source, this run would have
# compared permtrack's OLD values against our NEW ones, called the
# difference a change, and reverted every correction - twice a day, forever,
# with its change-detection logic reporting healthy writes the whole time.
#
# Two writers with different notions of truth pointed at one table is not a
# redundancy, it is a flip-flop. Re-enable this ONLY if the direct route
# stops working, and expect it to walk the table back to permtrack's view.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Which pass to run
        required: true
        default: pending
        type: choice
        options: [pending, full]

permissions:
  contents: read

# Never two mirrors at once: they share the upstream's rate budget and the
# same Turso table. Queue rather than cancel, so a long full pass is not
# killed halfway by the next pending tick.
concurrency:
  group: case-status-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Decide which pass this run is
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "15 4 * * 0" ]; then
            MODE="full"
          else
            MODE="pending"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "This run: $MODE"

      - name: Mirror per-case statuses
        working-directory: v2
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          printf 'TURSO_DATABASE_URL=%s\nTURSO_AUTH_TOKEN=%s\n' \
            "$TURSO_DATABASE_URL" "$TURSO_AUTH_TOKEN" > .env.local
          if [ "${{ steps.mode.outputs.mode }}" = "full" ]; then
            python3 scripts/mirror_case_status.py
          else
            python3 scripts/mirror_case_status.py --pending
          fi

      - name: Remove credentials
        if: always()
        working-directory: v2
        run: rm -f .env.local
