name: PWD case status (direct from DOL)

# Per-case PREVAILING WAGE (ETA-9141) status, straight from flag.dol.gov, the
# same endpoint and the same discipline as case-status-direct.yml. See
# scripts/ingest_pwd_status_direct.py for the two measurements this rests on:
# DOL's batch endpoint serves P- cases, and PERM and PWD filings share one
# serial counter, so the PERM corpus's serial range per filing day is the
# range to probe for that day's wage requests.
#
# THREE PASSES:
#   pending   daily 05:40 ET  - every IN PROCESS request (~8k PWD, 0 LCA:
#                               LCAs are final within a week). Discovery of
#                               new filings is NOT here any more: it is the
#                               unified serial walk in case-status-direct.yml,
#                               which asks every busy prefix per span and
#                               writes P-/I- hits into these tables.
#   full      Sundays 06:40 ET - every request FILED in the last 180 days
#                               (PWD) / 90 days (LCA), so a determination
#                               that later moves is seen. Walking every row
#                               needed ~230 min against a 170 min timeout and
#                               died at 65% every Sunday (first run Sep 6 2026).
#   backfill  dispatch only    - walks earlier filing days, resumable, ~60
#                               requests per day code; run it a few times
#                               with --from/--to until the range is covered
#
# Scheduled AFTER the PERM sweep (04:10 ET) so the serial windows it probes
# include that morning's PERM discoveries, and inside DOL's quiet hours.

on:
  schedule:
    - cron: "40 9 * * *"       # 05:40 ET daily - pending + discovery
    - cron: "40 10 * * 0"      # 06:40 ET Sundays - full
  workflow_dispatch:
    inputs:
      mode:
        description: Which pass to run
        required: true
        default: pending
        type: choice
        options: [pending, full, discover, backfill]
      from:
        description: "backfill only: first filing day, YYYY-MM-DD"
        required: false
        default: "2026-01-01"
      to:
        description: "backfill only: last filing day, YYYY-MM-DD"
        required: false
        default: "2026-08-31"

permissions:
  contents: read
  # The backfill re-dispatches itself until the range is covered (below).
  actions: write

# Two groups on purpose. GitHub keeps at most one running and ONE queued run
# per group and cancels the older queued one, so a backfill that queued its
# own next leg behind the daily cron would have that leg cancelled by it (or
# cancel the cron's sweep). Backfill legs chain in their own group.
concurrency:
  group: pwd-status-direct-${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'backfill') && 'backfill' || 'sweep' }}
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Note where the backfill starts
        if: github.event.inputs.mode == 'backfill'
        working-directory: v2
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          printf 'TURSO_DATABASE_URL=%s\nTURSO_AUTH_TOKEN=%s\n' \
            "$TURSO_DATABASE_URL" "$TURSO_AUTH_TOKEN" > .env.local
          echo "BACKFILL_BEFORE=$(python3 scripts/ingest_pwd_status_direct.py --progress)" >> "$GITHUB_ENV"

      - name: Sweep
        working-directory: v2
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          MODE_IN: ${{ github.event.inputs.mode }}
          FROM_IN: ${{ github.event.inputs.from }}
          TO_IN: ${{ github.event.inputs.to }}
        run: |
          printf 'TURSO_DATABASE_URL=%s\nTURSO_AUTH_TOKEN=%s\n' \
            "$TURSO_DATABASE_URL" "$TURSO_AUTH_TOKEN" > .env.local
          MODE="$MODE_IN"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "40 10 * * 0" ]; then
              MODE=full
            else
              MODE=pending
            fi
          fi
          echo "mode: $MODE"
          # The failure hook below records the MODE too, so a killed weekly
          # run and Monday's clean daily run are separate rows to the health
          # check (filename-only keys let the daily pass hide the weekly
          # failure on Sep 6 2026).
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          # `timeout` rather than the job cap, so a hang FAILS and notifies
          # instead of being cancelled silently (see case-status-direct.yml).
          case "$MODE" in
            backfill)
              # ~0.5 req/s measured, so 9,000 requests (the script's default
              # cap) is five hours and the 170m timeout would kill the leg as
              # a FAILURE every time. 4,500 ends cleanly in ~150 minutes; the
              # next leg is dispatched by the step below.
              timeout 170m python3 scripts/ingest_pwd_status_direct.py \
                --backfill --from "$FROM_IN" --to "$TO_IN" --cap 4500 ;;
            discover)
              timeout 90m python3 scripts/ingest_pwd_status_direct.py --discover ;;
            *)
              timeout 170m python3 scripts/ingest_pwd_status_direct.py --"$MODE" ;;
          esac

      # A backfill leg that stopped at its cap dispatches the next one. Guards:
      # only when it moved the frontier (a leg that made no progress would loop
      # forever), and only while the frontier is short of --to. GITHUB_TOKEN
      # may dispatch workflows; it is one of the two events it is allowed to
      # trigger.
      - name: Chain the next backfill leg
        # `!cancelled()`: a leg cancelled by a person must not dispatch its
        # successor; `success()` (the implicit default) would also skip on a
        # cap-stop that exited 0, which is the case that MUST chain.
        if: github.event.inputs.mode == 'backfill' && !cancelled()
        working-directory: v2
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_IN: ${{ github.event.inputs.from }}
          TO_IN: ${{ github.event.inputs.to }}
        run: |
          AFTER="$(python3 scripts/ingest_pwd_status_direct.py --progress)"
          TARGET="$(python3 scripts/ingest_pwd_status_direct.py --day-code "$TO_IN")"
          echo "frontier before: ${BACKFILL_BEFORE:-none}  after: ${AFTER:-none}  target: $TARGET"
          # Completion is checked BEFORE the no-progress guard: the leg that
          # finishes the range legitimately makes no progress past --to.
          if [ -n "$AFTER" ] && [ "$AFTER" -ge "$TARGET" ]; then
            echo "backfill complete through $TO_IN"; exit 0
          fi
          if [ -z "$AFTER" ] || [ "$AFTER" = "${BACKFILL_BEFORE:-}" ]; then
            echo "::error::backfill made no progress this leg; not chaining"; exit 1
          fi
          gh workflow run pwd-status-direct.yml --repo "$GITHUB_REPOSITORY" \
            -f mode=backfill -f from="$FROM_IN" -f to="$TO_IN"
          echo "dispatched the next leg"

      # THE ONLY THING THAT WILL SAY THIS RUN FAILED, TOMORROW.
      #
      # There is no alerting on these workflows. A red scheduled run does email
      # the repo owner, but three of the four ways this job can die send
      # nothing at all: a CANCELLED job (the job-level timeout-minutes cap),
      # a runner reclaimed mid-sweep, and any failure whose only record is an
      # Actions log that ages out. And the script's own `record_run` cannot
      # help there, because in those cases no Python is left running.
      #
      # So write the failure where machinery that already exists will find it.
      # `check_ingest_health.py` reads `ingest_runs` at 10:00 UTC daily and
      # exits non-zero when an ingest's most recent run did not finish clean,
      # which turns THAT run red and fires GitHub's own notification. No new
      # service, no new secret - it rides the Turso token this job already has.
      #
      # `cancelled()` as well as `failure()`: a cancellation is the case with
      # NO other signal whatsoever, so it is the one most worth recording. It
      # is best-effort inside the runner's cancellation grace window.
      - name: Record the failure where the health check will see it
        if: failure() || cancelled()
        working-directory: v2
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          # Env vars, not .env.local: a job that died before the sweep step
          # ever wrote that file still has to be able to report itself.
          python3 scripts/record_ingest_failure.py \
            --script "ingest_pwd_status_direct.py --${MODE:-unknown}" \
            --status "${{ job.status == 'cancelled' && 'cancelled' || 'failed' }}" \
            --note "pwd-status-direct: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Remove credentials
        if: always()
        working-directory: v2
        run: rm -f .env.local
