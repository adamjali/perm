name: PWD case status (direct from DOL)

# Per-case prevailing wage (ETA-9141) and LCA status, straight from
# flag.dol.gov, with the same discipline as case-status-direct.yml
# (scripts/ingest_pwd_status_direct.py has the details).
#
#   pending   daily 05:40 ET   every undecided request. New filings are found
#                              by the unified serial walk in case-status-direct.yml,
#                              which writes P- and I- hits into these tables.
#   full      Sundays 06:40 ET every request filed in the last 180 days (PWD)
#                              or 90 days (LCA), so a determination that later
#                              moves is seen
#   backfill  dispatch only    walks earlier filing days, resumable, chaining
#                              one leg after another until the range is covered
#
# Scheduled after the PERM sweep, inside DOL's quiet hours. The server's timers
# dispatch pwd-daily and pwd-weekly-full through /api/cron/dispatch, because
# GitHub's own `schedule` ran hours late on this repo.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Which pass to run
        required: true
        default: pending
        type: choice
        options: [pending, full, discover, backfill]
      from:
        description: "backfill only: first filing day, YYYY-MM-DD"
        required: false
        default: "2026-01-01"
      to:
        description: "backfill only: last filing day, YYYY-MM-DD"
        required: false
        default: "2026-08-31"

permissions:
  contents: read
  # A backfill re-dispatches itself until the range is covered (below).
  actions: write

# Two groups on purpose. GitHub keeps at most one running and ONE queued run
# per group and cancels the older queued one, so a backfill leg queued behind
# the daily sweep would be cancelled by it. Backfill legs chain in their own group.
concurrency:
  group: pwd-status-direct-${{ github.event.inputs.mode == 'backfill' && 'backfill' || 'sweep' }}
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Note where the backfill starts
        if: inputs.mode == 'backfill'
        working-directory: v2
        run: echo "BACKFILL_BEFORE=$(python3 scripts/ingest_pwd_status_direct.py --progress)" >> "$GITHUB_ENV"

      - name: Sweep
        working-directory: v2
        env:
          MODE_IN: ${{ inputs.mode }}
          FROM_IN: ${{ inputs.from }}
          TO_IN: ${{ inputs.to }}
        run: |
          MODE="${MODE_IN:-pending}"
          echo "mode: $MODE"
          # The failure hook below records the mode too, so a killed weekly run
          # and the next clean daily run are separate rows to the health check.
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          # `timeout` rather than the job cap, so a hang fails and notifies
          # instead of being cancelled silently.
          case "$MODE" in
            backfill)
              # ~0.5 requests a second, so 4,500 ends cleanly in about 150
              # minutes, inside this timeout; the next leg is dispatched below.
              timeout 170m python3 scripts/ingest_pwd_status_direct.py \
                --backfill --from "$FROM_IN" --to "$TO_IN" --cap 4500 ;;
            discover)
              timeout 90m python3 scripts/ingest_pwd_status_direct.py --discover ;;
            pending|full)
              timeout 170m python3 scripts/ingest_pwd_status_direct.py --"$MODE" ;;
            *)
              echo "::error::unknown mode '$MODE'"; exit 1 ;;
          esac

      # The wage-request and LCA summaries this run just wrote are printed by
      # /pwd-cases, /lca-cases and /case-search, on the PERM sweep's fixed list
      # (src/app/api/revalidate-sweep/paths.ts).
      - name: Expire the pages that print the sweep's figures
        if: success()
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "REVALIDATE_SECRET not set; skipping"; exit 0
          fi
          curl -fsS -X POST https://permtracker.app/api/revalidate-sweep \
            -H "x-revalidate-secret: $REVALIDATE_SECRET" || echo "revalidation call failed"

      # The resumer. A backfill chain can die two ways that nothing restarts:
      # a leg killed before it moved the frontier, and a leg that failed
      # outright. The daily pending run asks the record whether an incomplete
      # backfill has gone quiet and dispatches ONE leg, once a day, so a DOL
      # outage cannot loop it; the health check reports a frontier that has
      # not moved in 7 days.
      - name: Resume an incomplete backfill
        if: inputs.mode == 'pending' && !cancelled()
        working-directory: v2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DECISION="$(python3 scripts/ingest_pwd_status_direct.py --resume-check)"
          echo "$DECISION"
          case "$DECISION" in
            dispatch\ *)
              FROM="$(printf '%s' "$DECISION" | sed -n 's/.*from=\([^ ]*\).*/\1/p')"
              TO="$(printf '%s' "$DECISION" | sed -n 's/.*to=\([^ ]*\).*/\1/p')"
              gh workflow run pwd-status-direct.yml --repo "$GITHUB_REPOSITORY" \
                -f mode=backfill -f from="$FROM" -f to="$TO"
              echo "dispatched a backfill leg $FROM..$TO" ;;
          esac

      # A backfill leg that stopped at its cap dispatches the next one, but
      # only when it moved the frontier (a leg that made no progress would loop
      # forever) and only while the frontier is short of --to.
      - name: Chain the next backfill leg
        # `!cancelled()`: a leg a person cancelled must not dispatch its
        # successor, while a cap stop that exited 0 must.
        if: inputs.mode == 'backfill' && !cancelled()
        working-directory: v2
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_IN: ${{ inputs.from }}
          TO_IN: ${{ inputs.to }}
        run: |
          AFTER="$(python3 scripts/ingest_pwd_status_direct.py --progress)"
          TARGET="$(python3 scripts/ingest_pwd_status_direct.py --day-code "$TO_IN")"
          # A --to in the future can never be reached (day codes past today
          # hold no serials yet), so the target is capped at today.
          TODAY="$(python3 scripts/ingest_pwd_status_direct.py --day-code "$(date -u +%F)")"
          if [ "$TARGET" -gt "$TODAY" ]; then TARGET="$TODAY"; fi
          echo "frontier before: ${BACKFILL_BEFORE:-none}  after: ${AFTER:-none}  target: $TARGET"
          if python3 scripts/ingest_pwd_status_direct.py --progress-json | grep -q '"complete": true'; then
            echo "backfill recorded complete; nothing to chain"; exit 0
          fi
          # Completion is checked before the no-progress guard: the leg that
          # finishes the range legitimately makes no progress past --to.
          if [ -n "$AFTER" ] && [ "$AFTER" -ge "$TARGET" ]; then
            echo "backfill complete through $TO_IN"; exit 0
          fi
          if [ -z "$AFTER" ] || [ "$AFTER" = "${BACKFILL_BEFORE:-}" ]; then
            echo "::error::backfill made no progress this leg; not chaining"; exit 1
          fi
          gh workflow run pwd-status-direct.yml --repo "$GITHUB_REPOSITORY" \
            -f mode=backfill -f from="$FROM_IN" -f to="$TO_IN"
          echo "dispatched the next leg"

      # A cancelled or killed run leaves no other record; this one is what the
      # daily health check reads (see scripts/record_ingest_failure.py).
      - name: Record the failure where the health check will see it
        if: failure() || cancelled()
        working-directory: v2
        run: |
          python3 scripts/record_ingest_failure.py \
            --script "ingest_pwd_status_direct.py --${MODE:-unknown}" \
            --status "${{ job.status == 'cancelled' && 'cancelled' || 'failed' }}" \
            --note "pwd-status-direct: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
