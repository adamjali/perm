name: FLAG disclosure ingest
# The run's title names its program and file, so dispatches made close together
# (a run of history quarters) can be told apart by anyone listing the runs.
run-name: FLAG disclosure ingest${{ inputs.program && format(' ({0})', inputs.program) || '' }}${{ inputs.name && format(' {0}', inputs.name) || '' }}

# Loads DOL's quarterly disclosure files for every FLAG program, one row per
# case: prevailing wage (Form ETA-9141, `pwd_cases`), LCA
# (ETA-9035, `lca_cases`), and H-2A, H-2B and CW-1 (ETA-9142A, 9142B, 9142C) in one
# table, `seasonal_cases`. As in perm-disclosure-ingest.yml, the file URL is discovered from DOL's
# performance page, never constructed; the workbook is streamed (an LCA file
# is multiple GB of XML); and the run reports success only after `COUNT(*)` for
# the file equals the unique cases it read, less any a newer file's later
# decision kept.
#
# Monthly, not quarterly: DOL republishes each quarter a week or two after it
# ends, under a new filename, so a monthly check picks it up within weeks. The
# other months cost no rewrite: the script keeps the loaded file's SHA-256 and
# row count, and a run that sees the same hash with the rows present skips the
# write and re-stamps freshness. Dispatch with `force` to override that.
#
# Manual run, from a home connection (www.dol.gov 403s some addresses):
#   python3 v2/scripts/ingest_flag_disclosure.py --program pw
#   python3 v2/scripts/ingest_flag_disclosure.py --program lca

on:
  schedule:
    # 07:00 UTC on the 10th of every month, after the quarterly PERM ingest
    # (the 8th) so the two never contend for DOL's goodwill on one morning.
    - cron: "0 7 10 * *"
  workflow_dispatch:
    inputs:
      program:
        description: Which disclosure file to load
        required: true
        default: all
        type: choice
        options: [all, pw, lca, h2a, h2b, cw1]
      force:
        description: Write even if the file's hash matches the last load
        required: false
        type: boolean
        default: false
      fy:
        description: "History: load this fiscal year's newest file (e.g. 2025) instead of the newest overall"
        required: false
        default: ""
      name:
        description: "History: load this exact discovered file (LCA files are per-quarter, so fy reaches only one of each year)"
        required: false
        default: ""
      list_only:
        description: "Discover and print every file DOL publishes, then stop"
        required: false
        type: boolean
        default: false
      backfill_attorney:
        description: "Write ONLY the law-firm columns onto existing rows, then index them. Ten times cheaper than force."
        required: false
        type: boolean
        default: false
      backfill_place:
        description: "Write ONLY the worksite city and NAICS columns onto existing rows (one file per run; pair with name for LCA quarters)."
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Download and parse, print counts and three rows, write nothing"
        required: false
        type: boolean
        default: false
      dump_header:
        description: "Download and print the file's real column names, write nothing"
        required: false
        type: boolean
        default: false
      accept_drift:
        description: "Load although the file's shape differs from the newest load (an older layout). Read a dry run first."
        required: false
        type: boolean
        default: false
      backfill_lca_detail:
        description: "LCA only: write ONLY the worker counts, wage level and the two employer flags onto existing rows (one quarter per run; pair with name)."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One queue per program: a history load of one program never waits on, or is
# cancelled by, another program's dispatch (GitHub keeps one pending run per
# group and drops the rest). Scheduled runs share the `all` queue.
concurrency:
  group: flag-disclosure-ingest-${{ inputs.program || 'all' }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    # Generous because the LCA file is large. The `timeout` inside the step is
    # what bounds a hang, set below this so a stuck run fails and notifies
    # rather than being cancelled silently at the job cap.
    timeout-minutes: 240

    strategy:
      # One program failing must not cancel the other's load.
      fail-fast: false
      matrix:
        # A scheduled run and an `all` dispatch load both programs; a
        # dispatch naming one program loads only that one. The expression is
        # the `(cond && a) || b` form because Actions has no ternary.
        program: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.program != 'all' && format('["{0}"]', inputs.program)) || '["pw","lca","h2a","h2b","cw1"]') }}

    # lib_turso.env() reads the environment first, so no credentials file is
    # written to the runner's disk.
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Load the ${{ matrix.program }} disclosure file
        working-directory: v2
        # Inputs reach the shell through env and are checked against the
        # allowed set before they touch a command. Interpolating `${{ ... }}`
        # straight into `run:` splices the value into the command itself.
        env:
          PROGRAM: ${{ matrix.program }}
          FORCE: ${{ inputs.force }}
          FY: ${{ inputs.fy }}
          BACKFILL_ATTORNEY: ${{ inputs.backfill_attorney }}
          BACKFILL_PLACE: ${{ inputs.backfill_place }}
          BACKFILL_LCA_DETAIL: ${{ inputs.backfill_lca_detail }}
          NAME: ${{ inputs.name }}
          LIST_ONLY: ${{ inputs.list_only }}
          DRY_RUN: ${{ inputs.dry_run }}
          DUMP_HEADER: ${{ inputs.dump_header }}
          ACCEPT_DRIFT: ${{ inputs.accept_drift }}
        run: |
          case "$PROGRAM" in
            pw|lca|h2a|h2b|cw1) ;;
            *) echo "::error::program must be pw, lca, h2a, h2b or cw1, got '$PROGRAM'"; exit 1 ;;
          esac
          if [ -z "$TURSO_DATABASE_URL" ] || [ -z "$TURSO_AUTH_TOKEN" ]; then
            echo "::error::database secrets absent; nothing to load into."
            exit 1
          fi
          EXTRA=""
          if [ "$FORCE" = "true" ]; then
            EXTRA="--force"
          fi
          # One mode per run. A backfill writes only its columns and returns
          # before the ordinary load, so pairing it with --force would quietly
          # ignore the force.
          if [ "$BACKFILL_ATTORNEY" = "true" ]; then
            if [ "$FORCE" = "true" ]; then
              echo "::error::pick one of force or backfill_attorney, not both"
              exit 1
            fi
            EXTRA="--backfill-attorney"
          fi
          if [ "$BACKFILL_PLACE" = "true" ]; then
            if [ "$FORCE" = "true" ] || [ "$BACKFILL_ATTORNEY" = "true" ]; then
              echo "::error::backfill_place runs alone, without force or backfill_attorney"
              exit 1
            fi
            EXTRA="--backfill-place"
          fi
          if [ "$BACKFILL_LCA_DETAIL" = "true" ]; then
            if [ "$PROGRAM" != "lca" ] || [ "$FORCE" = "true" ] || [ "$BACKFILL_ATTORNEY" = "true" ] || [ "$BACKFILL_PLACE" = "true" ]; then
              echo "::error::backfill_lca_detail runs alone, on program lca"
              exit 1
            fi
            EXTRA="--backfill-lca-detail"
          fi
          if [ -n "$FY" ]; then
            case "$FY" in
              20[0-9][0-9]) EXTRA="$EXTRA --fy $FY" ;;
              *) echo "::error::fy must be a four-digit year, got '$FY'"; exit 1 ;;
            esac
          fi
          # Discovery only: no download, no writes. Run this first to find out
          # which quarters exist before deciding to load any of them.
          if [ "$LIST_ONLY" = "true" ]; then
            python3 scripts/ingest_flag_disclosure.py --program "$PROGRAM" ${FY:+--fy "$FY"} --list
            exit 0
          fi
          # A specific quarter, checked against DOL's naming before it reaches a
          # command; the script then refuses any name its discovery didn't
          # return, so a typo can't become a constructed URL.
          if [ -n "$NAME" ]; then
            case "$NAME" in
              *[!A-Za-z0-9_.-]*) echo "::error::name has characters no DOL filename uses: '$NAME'"; exit 1 ;;
              *FY[0-9][0-9]*.xlsx) EXTRA="$EXTRA --name $NAME" ;;
              *) echo "::error::name must be a DOL disclosure filename, got '$NAME'"; exit 1 ;;
            esac
          fi
          # Probes: download and parse, write nothing.
          if [ "$DUMP_HEADER" = "true" ]; then
            timeout 60m python3 scripts/ingest_flag_disclosure.py --program "$PROGRAM" ${NAME:+--name "$NAME"} ${FY:+--fy "$FY"} --dump-header
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            timeout 120m python3 scripts/ingest_flag_disclosure.py --program "$PROGRAM" ${NAME:+--name "$NAME"} ${FY:+--fy "$FY"} --dry-run --dump-rows 3
            exit 0
          fi
          if [ "$ACCEPT_DRIFT" = "true" ]; then
            EXTRA="$EXTRA --accept-drift"
          fi
          echo "program: $PROGRAM ${EXTRA:+($EXTRA)}"
          # `timeout` rather than the job cap, so a hang fails and notifies.
          timeout 230m python3 scripts/ingest_flag_disclosure.py --program "$PROGRAM" $EXTRA

      # At this table's size the LCA salary explorer's queries outrun the read
      # layer's deadline, so it reads precomputed docs, rebuilt here after the
      # load and before the expiry below (expiring first would regenerate the
      # pages against the previous quarter). The reader keeps the live query as
      # a fallback, so a skipped rebuild is a slow page, never an empty one.
      - name: Rebuild the LCA salary explorer's precomputed docs
        # A detail or place backfill writes no wage, so these docs cannot change.
        if: success() && matrix.program == 'lca' && inputs.backfill_lca_detail != true && inputs.backfill_place != true && inputs.dry_run != true && inputs.dump_header != true && inputs.list_only != true
        working-directory: v2
        run: |
          timeout 30m python3 scripts/build_lca_facets.py
          # Every LCA selection of 5,000+ filings (src/lib/turso/wageViews.ts).
          timeout 30m python3 scripts/build_wage_views.py --program lca

      # When DOL usually decides an H-2A, H-2B or CW-1 application, measured
      # from every certification in seasonal_cases (the case page's timing
      # panel reads it). After any of the three loads, so it moves with them.
      - name: Rebuild the seasonal decision timing
        if: success() && (matrix.program == 'h2a' || matrix.program == 'h2b' || matrix.program == 'cw1') && inputs.dry_run != true && inputs.dump_header != true && inputs.list_only != true
        working-directory: v2
        run: timeout 10m python3 scripts/build_seasonal_timing.py

      # H-2A, H-2B and CW-1 decisions per day, by DOL's own decision date
      # (/seasonal-cases draws them). A failure is recorded, never silent, and
      # leaves the old series in place.
      - name: Rebuild the seasonal decisions per day
        if: success() && (matrix.program == 'h2a' || matrix.program == 'h2b' || matrix.program == 'cw1') && inputs.dry_run != true && inputs.dump_header != true && inputs.list_only != true
        working-directory: v2
        run: |
          timeout 10m python3 scripts/build_daily_decisions.py --only seasonal || {
            python3 scripts/record_ingest_failure.py --script build_daily_decisions.py \
              --note "seasonal series: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            exit 1
          }

      # The pages built from these files sit on a week-long window, which is
      # only right if a load expires them. `success()` so a failed or refused
      # load never claims fresh pages.
      - name: Expire the pages built from the disclosure files
        if: success() && inputs.dry_run != true && inputs.dump_header != true && inputs.list_only != true
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "REVALIDATE_SECRET not set; skipping"; exit 0
          fi
          curl -fsS -X POST https://permtracker.app/api/revalidate-disclosure \
            -H "x-revalidate-secret: $REVALIDATE_SECRET" \
            || echo "revalidation call failed"
