name: IndexNow

# Pings IndexNow (Bing, Yandex, Seznam, …) with every sitemap URL after each
# successful PRODUCTION deploy, so search/AI engines recrawl fast. Bing's index
# feeds ChatGPT Search and Perplexity, so this keeps AI-search (GEO) fresh with
# zero manual effort. Manual run anytime: `node v2/scripts/indexnow.mjs`.

on:
  # After each successful deploy to the server (the site left Vercel on Sep 28
  # 2026, and Vercel's deployment events with it).
  workflow_run:
    workflows: ["Oracle build and deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    # Only after a deploy that succeeded (or a manual run).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
      - name: Submit sitemap URLs to IndexNow
        working-directory: v2
        run: node scripts/indexnow.mjs
