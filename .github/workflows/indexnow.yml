name: IndexNow

# Sends EVERY sitemap URL to IndexNow (Bing, Yandex, Seznam and others), by
# hand only: IndexNow's FAQ allows a full send after a migration or a
# site-wide redesign, and asks otherwise to "Submit only when content has
# changed. Do not resubmit unchanged URLs", since every URL sent counts toward
# the site's crawl quota.
#
# The pages a deploy changed are sent by the deploy itself
# (oracle-deploy.yml, "Tell IndexNow which pages this deploy changed"). Until
# Oct 18 2026 this workflow waited for each successful deploy run, but a push
# held for the night window succeeds without shipping anything, so a
# finished run no longer meant new pages were live.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
      - name: Submit every sitemap URL
        working-directory: v2
        run: node scripts/indexnow.mjs
