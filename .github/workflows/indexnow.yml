name: IndexNow

# Pings IndexNow (Bing, Yandex, Seznam and others) with every sitemap URL after
# each successful production deploy, so search and AI engines recrawl quickly.
# Bing's index feeds several AI search products. Manual run any time:
# `node v2/scripts/indexnow.mjs`.

on:
  workflow_run:
    workflows: ["Oracle build and deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    # Only after a deploy that succeeded (or a manual run).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
      - name: Submit sitemap URLs to IndexNow
        working-directory: v2
        run: node scripts/indexnow.mjs
