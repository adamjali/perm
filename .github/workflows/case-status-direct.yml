name: Case status (direct from DOL)

# Per-case PERM status, straight from flag.dol.gov instead of permtrack's
# mirror of it. See scripts/ingest_case_status_direct.py for the measurement
# that established the endpoint is open (the path is NAMED recaptcha and
# nothing in the flow is a captcha) and that nothing is lost by switching.
#
# TWO PASSES, TWO CHECKPOINTS, for the same reason the mirror had two:
#   full     daily 04:10 ET  - all ~414k cases, 8,281 requests, ~69 min
#   pending  daily 15:40 ET  - the ~97k undecided, 1,948 requests, ~16 min
#
# The full pass is DAILY rather than weekly because "final" is not final: a
# CERTIFIED case silently becomes CERTIFIED - EXPIRED when the 180-day I-140
# window lapses, and nothing announces it. The first smoke test found 171 of
# those in 200 rows. Weekly meant a case could read as certified for six days
# after it had lapsed.
#
# Measured before choosing daily: 10,229 requests/day over ~85 minutes is
# 2.0 requests/second. Turso writes stay ~1,300/day because only CHANGED rows
# are written, against a 10M/month plan, and Actions minutes are free on a
# public repo. The binding cost is politeness to a government host, and 2/s
# for under an hour and a half is modest for a public search endpoint that
# answers the same query for real users all day.
#
# The pending pass survives because it is cheap and it halves the worst-case
# staleness on the cases people actually have alerts on.
#
# Scheduled AROUND DOL's habits, not through them. FLAG publishes evening
# maintenance windows (observed 19:00-21:00 ET), so both passes run in the
# early hours ET. The script also retries each batch with backoff and stops
# cleanly after three consecutive failures rather than hammering a host that
# is down - and it flushes as it goes, so a shutdown mid-run keeps the work.

on:
  schedule:
    - cron: "40 19 * * *"      # 15:40 ET - pending only, the mid-day refresh
    - cron: "10 8 * * *"       # 04:10 ET - EVERY case, daily
  workflow_dispatch:
    inputs:
      mode:
        description: Which pass to run
        required: true
        default: pending
        type: choice
        options: [pending, full]

permissions:
  contents: read

concurrency:
  group: case-status-direct
  cancel-in-progress: false     # never kill a half-written sweep

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sweep
        working-directory: v2
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          printf 'TURSO_DATABASE_URL=%s\nTURSO_AUTH_TOKEN=%s\n' \
            "$TURSO_DATABASE_URL" "$TURSO_AUTH_TOKEN" > .env.local
          # 08:10 UTC (04:10 ET) is the DAILY full pass; the other cron is
          # the pending pass. workflow_dispatch overrides both.
          # Keep this string in step with the cron above: if they drift, the
          # full pass silently becomes a second pending pass and the
          # expiration sweep stops happening with nothing erroring.
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "10 8 * * *" ]; then
              MODE=full
            else
              MODE=pending
            fi
          fi
          echo "mode: $MODE"
          python3 scripts/ingest_case_status_direct.py --"$MODE"

      - name: Remove credentials
        if: always()
        working-directory: v2
        run: rm -f .env.local
