name: Case status (direct from DOL)

# Per-case PERM status, straight from flag.dol.gov instead of permtrack's
# mirror of it. See scripts/ingest_case_status_direct.py for the measurement
# that established the endpoint is open (the path is NAMED recaptcha and
# nothing in the flow is a captcha) and that nothing is lost by switching.
#
# TWO PASSES, TWO CHECKPOINTS, for the same reason the mirror had two:
#   full     daily 04:10 ET  - all ~414k cases, 8,281 requests, ~69 min
#   pending  daily 15:40 ET  - the ~97k undecided, 1,948 requests, ~16 min
#
# The full pass is DAILY rather than weekly because "final" is not final: a
# CERTIFIED case silently becomes CERTIFIED - EXPIRED when the 180-day I-140
# window lapses, and nothing announces it. The first smoke test found 171 of
# those in 200 rows. Weekly meant a case could read as certified for six days
# after it had lapsed.
#
# Measured before choosing daily: 10,229 requests/day over ~85 minutes is
# 2.0 requests/second. Turso writes stay ~1,300/day because only CHANGED rows
# are written, against a 10M/month plan, and Actions minutes are free on a
# public repo. The binding cost is politeness to a government host, and 2/s
# for under an hour and a half is modest for a public search endpoint that
# answers the same query for real users all day.
#
# The pending pass survives because it is cheap and it halves the worst-case
# staleness on the cases people actually have alerts on.
#
# Scheduled AROUND DOL's habits, not through them. FLAG publishes evening
# maintenance windows (observed 19:00-21:00 ET), so both passes run in the
# early hours ET. The script also retries each batch with backoff and stops
# cleanly after three consecutive failures rather than hammering a host that
# is down - and it flushes as it goes, so a shutdown mid-run keeps the work.

on:
  schedule:
    - cron: "40 19 * * *"      # 15:40 ET - pending only, the mid-day refresh
    - cron: "10 8 * * *"       # 04:10 ET - EVERY case, daily
  workflow_dispatch:
    inputs:
      mode:
        description: Which pass to run
        required: true
        default: pending
        type: choice
        options: [pending, full]

permissions:
  contents: read

concurrency:
  group: case-status-direct
  cancel-in-progress: false     # never kill a half-written sweep

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sweep
        working-directory: v2
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          printf 'TURSO_DATABASE_URL=%s\nTURSO_AUTH_TOKEN=%s\n' \
            "$TURSO_DATABASE_URL" "$TURSO_AUTH_TOKEN" > .env.local
          # 08:10 UTC (04:10 ET) is the DAILY full pass; the other cron is
          # the pending pass. workflow_dispatch overrides both.
          # Keep this string in step with the cron above: if they drift, the
          # full pass silently becomes a second pending pass and the
          # expiration sweep stops happening with nothing erroring.
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "10 8 * * *" ]; then
              MODE=full
            else
              MODE=pending
            fi
          fi
          echo "mode: $MODE"
          # `timeout`, not the job's timeout-minutes, is what makes a hung sweep
          # NOTIFY. A job that hits timeout-minutes is CANCELLED, and GitHub
          # sends nothing for a cancellation - which is how the 2026-08-28 full
          # sweep died two-thirds through with no alert. `timeout 105m` exits
          # 124 (a real failure, red, notified) below the 120m job cap, which
          # is a genuine hang: the full pass is ~85 min and the script already
          # stops itself cleanly after three consecutive far-end failures.
          timeout 105m python3 scripts/ingest_case_status_direct.py --"$MODE"
          # The searchable remainder (cases newer than the last disclosure
          # file) rebuilds right after the sweep, so the case search and the
          # employer pages see today's discoveries with canonical slugs.
          # Cheap (one quarter of filings at most); failure here must not
          # mark the sweep failed - the band just stays a day staler.
          python3 scripts/build_entity_detail.py --live-recent-only || true

      # Expire the employer pages whose live rows just moved.
      #
      # /perm-employers/[slug] caches for 30 days, which is right for the
      # quarterly figures on it and a month too long for the live band. A
      # route segment gets one window, so the pages that changed are expired
      # by PATH instead. The rebuild above writes the slug list, busiest
      # first, capped to match the endpoint's own limit.
      #
      # `|| true` for the same reason as the rebuild: a page staying a day
      # staler is not a reason to mark a 85-minute federal data sweep failed.
      # The step is skipped rather than failing when the file is absent, which
      # is what a rebuild that itself failed leaves behind.
      - name: Expire changed employer pages
        if: always()
        working-directory: v2
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ ! -s changed-employer-slugs.json ]; then
            echo "no slug list written; nothing to expire"; exit 0
          fi
          # An EMPTY list is the normal quiet night, not a failure. The file
          # still exists and is 13 bytes of '{"slugs": []}', so `-s` passes
          # it straight through to a POST the endpoint correctly rejects with
          # 400 "No usable slugs" - which `curl -f` then reports as
          # "revalidation call failed". Measured by running the rebuild on a
          # night with nothing to write. A healthy no-op that logs an error
          # trains everyone to ignore the log, which is worse than no log.
          N=$(python3 -c "import json;print(len(json.load(open('changed-employer-slugs.json'))['slugs']))" 2>/dev/null || echo 0)
          if [ "$N" -eq 0 ]; then
            echo "no employer pages changed; nothing to expire"; exit 0
          fi
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "REVALIDATE_SECRET not set; skipping"; exit 0
          fi
          echo "expiring $N employer pages"
          # -f so a 4xx/5xx is visible in the log rather than a silent 403
          # body scrolling past as if it were a success.
          curl -fsS -X POST https://permtracker.app/api/revalidate-live-employers \
            -H "x-revalidate-secret: $REVALIDATE_SECRET" \
            -H "content-type: application/json" \
            --data @changed-employer-slugs.json || echo "revalidation call failed"

      - name: Remove credentials
        if: always()
        working-directory: v2
        run: rm -f .env.local
