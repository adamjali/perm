name: Case status (direct from DOL)

# Per-case PERM status, straight from flag.dol.gov's open batch endpoint
# (scripts/ingest_case_status_direct.py has the details).
#
#   full      daily 04:10 ET  every case, plus the discovery walk and the gap sweep
#   pending   daily 15:40 ET  the undecided cases, plus the discovery walk
#   discover  dispatch only   the serial walk on its own, to recover a gap
#
# The full pass is daily because "final" is not final: a CERTIFIED case
# becomes CERTIFIED - EXPIRED when its 180-day I-140 window lapses, and nothing
# announces it. The pending pass halves the worst-case staleness on the cases
# people have alerts on. Both run in DOL's quiet hours, around its published
# evening maintenance windows, and the script backs off and stops cleanly when
# the far end keeps failing.
#
# The server's timers dispatch both passes through /api/cron/dispatch
# (v2/src/app/api/cron/dispatch/jobs.ts), because GitHub's own `schedule` ran
# hours late on this repo.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Which pass to run
        required: true
        default: pending
        type: choice
        options: [pending, full, discover]
      discover_cap:
        description: "discover only: request cap for this walk. ~1.4 s each and 5 serials each; the walk also stops on its own 95-minute budget. 2,000 is ~10,000 serials, two to three weekdays"
        required: false
        default: "2000"
      frontier:
        description: "discover only: reset the walk cursor to YYDDD:SERIAL first, e.g. 26240:200246"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: case-status-direct
  cancel-in-progress: false     # never kill a half-written sweep

jobs:
  sweep:
    runs-on: ubuntu-24.04
    # Above the main step's `timeout 105m`, the gap sweep's 25m, the published
    # sync's 15m and the Monday backtest's 20m. The step-level `timeout`
    # commands are what catch a hang (see below).
    timeout-minutes: 175
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Sweep
        working-directory: v2
        env:
          MODE_IN: ${{ inputs.mode }}
          CAP_IN: ${{ inputs.discover_cap }}
          FRONTIER_IN: ${{ inputs.frontier }}
        run: |
          MODE="${MODE_IN:-pending}"
          case "$MODE" in
            pending|full|discover) ;;
            *) echo "::error::unknown mode '$MODE'"; exit 1 ;;
          esac
          echo "mode: $MODE"
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          # `timeout` rather than the job's timeout-minutes, so a hang exits 124
          # and fails visibly: GitHub sends nothing for a cancelled job.
          if [ "$MODE" = "discover" ]; then
            # ~1.4 s a request; the script stops itself on its 95-minute budget
            # (DISCOVERY_BUDGET_MIN["discover"]), inside this 100.
            timeout 100m python3 scripts/ingest_case_status_direct.py --discover \
              --discover-cap "${CAP_IN:-2000}" ${FRONTIER_IN:+--frontier "$FRONTIER_IN"}
          else
            timeout 105m python3 scripts/ingest_case_status_direct.py --"$MODE"
          fi
          # The searchable live remainder rebuilds right after, so the case
          # search and the employer pages see today's discoveries. A failure
          # here leaves the band a day staler; it must not fail the sweep.
          python3 scripts/build_entity_detail.py --live-recent-only || true
          # Employers whose only filings are H-2A, H-2B or CW-1 get a page from
          # this table; it runs after the live-only rebuild because it leaves
          # out every slug that already has a page, and adds the pages it
          # changed to the expiry list below.
          python3 scripts/build_seasonal_employers.py || true

      # The walk only moves forward, so this is its second look: it re-asks DOL
      # about the holes in the trailing 90 day codes and writes only what DOL
      # confirms. A gap sweep that stops running is a slow corpus leak with no
      # other symptom, so its failure is recorded for the health check.
      - name: Sweep the serial gaps
        if: env.MODE == 'full'
        working-directory: v2
        run: |
          timeout 25m python3 scripts/sweep_serial_gaps.py --window 90 --cap 600 \
            || python3 scripts/record_ingest_failure.py \
                 --script "sweep_serial_gaps.py" \
                 --note "gap sweep: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # Every case DOL's published files hold goes into the live tables where
      # it can still change (every new-form PERM case; wage requests and LCAs
      # inside their re-check windows), confirmed with DOL first. A night with
      # nothing to sync asks nothing. A failure is recorded, never fatal.
      - name: Sync published cases into the live tables
        if: env.MODE == 'full'
        working-directory: v2
        run: |
          timeout 15m python3 scripts/sync_published_live.py --cap 400 \
            || python3 scripts/record_ingest_failure.py \
                 --script "sync_published_live.py" \
                 --note "published sync: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # How fast DOL is deciding the in-line cases its queue has passed, from
      # the sweep's own events: the date range a case behind the queue shows.
      # The estimate falls back to no date when this is stale or thin.
      - name: Measure the stragglers
        if: env.MODE == 'full'
        working-directory: v2
        run: |
          timeout 5m python3 scripts/build_straggler_rates.py \
            || python3 scripts/record_ingest_failure.py \
                 --script "build_straggler_rates.py" \
                 --note "stragglers: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # The standing estimator backtest, Mondays on the full pass. It scores
      # the site's dates against what DOL decided since and writes the one doc
      # /estimate-scorecard prints. A failure only warns: the page keeps last
      # week's figure and says when it was computed.
      - name: Estimator backtest (weekly)
        if: env.MODE == 'full'
        working-directory: v2
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            timeout 20m python3 scripts/backtest_queue.py --write \
              || echo "::warning::estimator backtest failed; the scorecard keeps last week's figure"
          else
            echo "not Monday; the backtest runs weekly"
          fi

      # Employer pages cache for 30 days, right for their quarterly figures and
      # too long for the live band, so the pages whose live rows moved are
      # expired by path. The rebuild above writes the list, busiest first. A
      # page staying a day staler is not a reason to fail the sweep.
      - name: Expire changed employer pages
        if: always()
        working-directory: v2
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ ! -s changed-employer-slugs.json ]; then
            echo "no slug list written; nothing to expire"; exit 0
          fi
          # An empty list is a quiet night, and the endpoint rejects it with a
          # 400, so it is skipped here rather than logged as a failed call.
          N=$(python3 -c "import json;print(len(json.load(open('changed-employer-slugs.json'))['slugs']))" 2>/dev/null || echo 0)
          if [ "$N" -eq 0 ]; then
            echo "no employer pages changed; nothing to expire"; exit 0
          fi
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "REVALIDATE_SECRET not set; skipping"; exit 0
          fi
          echo "expiring $N employer pages"
          curl -fsS -X POST https://permtracker.app/api/revalidate-live-employers \
            -H "x-revalidate-secret: $REVALIDATE_SECRET" \
            -H "content-type: application/json" \
            --data @changed-employer-slugs.json || echo "revalidation call failed"

      # The pages that print the sweep's own figures (the daily decisions, the
      # census, the review stages) move when the record does. Fixed list, no
      # input: src/app/api/revalidate-sweep/paths.ts.
      - name: Expire the pages that print the sweep's figures
        if: success()
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "REVALIDATE_SECRET not set; skipping"; exit 0
          fi
          curl -fsS -X POST https://permtracker.app/api/revalidate-sweep \
            -H "x-revalidate-secret: $REVALIDATE_SECRET" || echo "revalidation call failed"

      # A cancelled or killed run leaves no other record; this one is what the
      # daily health check reads (see scripts/record_ingest_failure.py).
      - name: Record the failure where the health check will see it
        if: failure() || cancelled()
        working-directory: v2
        run: |
          python3 scripts/record_ingest_failure.py \
            --script "ingest_case_status_direct.py --${MODE:-unknown}" \
            --status "${{ job.status == 'cancelled' && 'cancelled' || 'failed' }}" \
            --note "case-status-direct: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
