name: DOL processing times

# The daily federal reads that are each one small fetch: DOL's processing times
# (flag.dol.gov/processingtimes), the Federal Register feed, OFLC's
# announcements, state WARN notices, DOL's debarment lists, the visa bulletin
# and the State Department's annual limits. Each later step runs whatever
# happened before it and records its own failure, so one source's bad day
# never costs the others.
#
# The processing-times row is keyed by DOL's own as-of date, so a run on a day
# DOL has not republished replaces a row with an identical one and never
# invents a history point (the PWD drain rate is measured between two
# different as-of dates).
#
# The server's timer dispatches this daily at 07:00 UTC through
# /api/cron/dispatch, because GitHub's own `schedule` ran hours late here.
#
# Manual run:
#   cd v2 && node --experimental-strip-types scripts/ingest_processing_times.mts

run-name: ${{ inputs.quick == 'true' && 'DOL processing times (hourly)' || 'DOL processing times' }}

on:
  workflow_dispatch:
    inputs:
      quick:
        description: "Only DOL's processing times and the visa bulletin (the weekday hourly pass)"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: processing-times-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    # The WARN step reads 41 state sites one request at a time: about 5 to 8
    # minutes most days, longer on the day Florida reads its whole history,
    # and about 20 on a first load. Every other step is a minute or two.
    timeout-minutes: 50
    env:
      DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      # The H-1B LCA filings' own database (Oct 19 2026); empty means the main one.
      DATABASE_LCA_URL: ${{ secrets.DATABASE_LCA_URL }}
      DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x

      - name: Install
        working-directory: v2
        # @libsql/client for the processing-times ingest. A frozen lockfile so a
        # transitive bump cannot change what a scheduled job runs without a
        # commit saying so.
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Fetch and store
        id: ingest
        working-directory: v2
        run: node --experimental-strip-types scripts/ingest_processing_times.mts

      # openpyxl reads the WARN spreadsheets; pdfplumber reads the debarment
      # and annual-limits PDFs and the states that post WARN notices as a PDF.
      # Installed here because nothing else in the tree needs them.
      - name: Python dependencies
        if: always()
        run: |
          python3 -m pip install --quiet --user openpyxl pdfplumber \
            || python3 -m pip install --quiet --break-system-packages openpyxl pdfplumber

      - name: Federal Register notices
        if: always() && inputs.quick != 'true'
        working-directory: v2
        run: |
          python3 scripts/ingest_policy_notices.py \
            || python3 scripts/record_ingest_failure.py --script ingest_policy_notices.py --note "policy feed failed" || true

      # OFLC's announcements page, into the policy feed. A parse of zero rows
      # refuses to write rather than emptying the feed's OFLC half.
      - name: OFLC announcements
        if: always() && inputs.quick != 'true'
        working-directory: v2
        run: |
          python3 scripts/ingest_oflc_news.py \
            || python3 scripts/record_ingest_failure.py --script ingest_oflc_news.py --note "OFLC announcements failed"

      # Forty-seven states and DC (scripts/ingest_warn.py and scripts/warn_states.py).
      # A state whose site is down that day is named in the run's note and its
      # own freshness row is the alarm; a parse that breaks turns the run partial.
      # Texas's own site challenges scripts, so its automatic source is the state's
      # open data portal.
      - name: WARN notices
        if: always() && inputs.quick != 'true'
        working-directory: v2
        timeout-minutes: 35
        run: |
          python3 scripts/ingest_warn.py \
            || python3 scripts/record_ingest_failure.py --script ingest_warn.py --note "WARN notices failed"

      # The OFLC program-debarments PDF (PERM, H-2A, H-2B) and the Wage and
      # Hour H-1B page. www.dol.gov answers this runner with a full browser
      # header set.
      - name: Debarment lists
        if: always() && inputs.quick != 'true'
        working-directory: v2
        run: |
          python3 scripts/ingest_debarments.py \
            || python3 scripts/record_ingest_failure.py --script ingest_debarments.py --note "debarment lists failed" || true

      # The visa bulletin from the State Department's own adoption.state.gov
      # host (travel.state.gov refuses scripts). A refusal warns and exits 0:
      # the visa-bulletin freshness budget is the alarm, and --from-file with a
      # browser-saved page is the fallback.
      - name: Visa bulletin (direct)
        id: bulletin
        if: always()
        working-directory: v2
        run: |
          python3 scripts/ingest_visa_bulletin.py --direct \
            || python3 scripts/record_ingest_failure.py --script ingest_visa_bulletin.py --note "visa bulletin direct read failed"

      # The bulletin pages sit on a one-day window, so a bulletin stored today
      # expires them now rather than tomorrow.
      - name: Expire the bulletin pages
        if: always() && steps.bulletin.outputs.bulletin_changed == 'true'
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "REVALIDATE_SECRET not set; skipping"; exit 0
          fi
          curl -fsS -X POST https://permtracker.app/api/revalidate-bulletin \
            -H "x-revalidate-secret: $REVALIDATE_SECRET" \
            || { echo "::error::revalidation call failed (revalidate-bulletin)"; echo "revalidate-bulletin" >> "$RUNNER_TEMP/pt-failed-steps"; }

      # The yearly spillover figures (annual limits, Table V) from the same
      # State host. A PDF is fetched only in the week a new fiscal year appears.
      - name: Visa annual limits (direct)
        if: always() && inputs.quick != 'true'
        working-directory: v2
        run: |
          python3 scripts/ingest_visa_limits.py --discover \
            || python3 scripts/record_ingest_failure.py --script ingest_visa_limits.py --note "visa limits discovery failed"

      # Expire the pages that print DOL's figure, only on a day DOL actually
      # republished (roughly weekly). A failed call doesn't stop the steps after
      # it (the data is already stored); it turns the run red at the end.
      - name: Expire the DOL pages
        if: steps.ingest.outputs.dol_changed == 'true'
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          # Through env, not interpolated into the shell: the value is parsed
          # out of a third party's HTML, so it is untrusted.
          PERM_AS_OF: ${{ steps.ingest.outputs.perm_as_of }}
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "REVALIDATE_SECRET not set; skipping"; exit 0
          fi
          echo "DOL published a new as-of ($PERM_AS_OF); expiring the pages that show it"
          curl -fsS -X POST https://permtracker.app/api/revalidate-dol \
            -H "x-revalidate-secret: $REVALIDATE_SECRET" \
            || { echo "::error::revalidation call failed (revalidate-dol)"; echo "revalidate-dol" >> "$RUNNER_TEMP/pt-failed-steps"; }

      # A second, independent read of the same public sources from a third
      # party, compared rather than imported: a disagreement on a cutoff both
      # sides publish means one side has a parsing bug. Their availability is
      # not our correctness: the script skips clean when they don't answer. A
      # real disagreement marks the run, and the last step turns it red.
      - name: Cross-check against a third-party source
        if: always() && inputs.quick != 'true'
        working-directory: v2
        env:
          CROSS_CHECK_API: ${{ secrets.CROSS_CHECK_API }}
        run: |
          python3 scripts/cross_check_sources.py \
            || { echo "::error::the cross-check found a disagreement with the third party"; echo "cross-check" >> "$RUNNER_TEMP/pt-failed-steps"; }

      # A step that failed and carried on (each leaves a line in this file,
      # through record_ingest_failure.py or its own `||` branch) still turns the
      # run red, so GitHub says so that morning. Oct 10 2026: a full disk failed
      # ten doc writes and four steps, the run stayed green, and the health
      # check, which reads rows in the database, had no row to read.
      - name: Fail the run when a step failed and carried on
        if: always()
        run: |
          f="$RUNNER_TEMP/pt-failed-steps"
          if [ -s "$f" ]; then
            echo "::error::these steps failed and the run carried on: $(sort -u "$f" | paste -sd ',' -)"
            exit 1
          fi
          echo "every step that ran finished clean"
