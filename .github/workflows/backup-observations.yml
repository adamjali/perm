name: Backup observations

# Weekly dump of the database tables that cannot be rebuilt from DOL's files:
# per-case status rows, the event log, precomputed docs, the audit trail and
# the small federal series whose sources keep no archive. See
# scripts/dump_observations.py for the reasoning and the table list.
#
# Sealed before upload (Nov 3 2026): any signed-in GitHub user can download a
# public repository's artifacts, and the event log is this site's own work, so
# the dump is a tar sealed with the PUBLIC half of the backup key, the same way
# convex-backup.yml seals Convex. Only the private half on the owner's Mac
# opens it. 90 days is the longest retention GitHub offers.
#
# Restore: download the artifact, then
#   openssl cms -decrypt -binary -inform DER -in observations.tar.cms \
#     -inkey backup-key.pem | tar -xf -
# and load each .jsonl.gz with INSERT OR IGNORE by primary key (a dump is a
# snapshot, never a replacement). The event logs are never pruned, so the
# newest artifact holds every transition the older ones do.

on:
  schedule:
    - cron: "0 3 * * 0"        # Sundays 03:00 UTC: Saturday 11 PM EDT, 10 PM EST, before the sweeps
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-observations
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      # The H-1B LCA filings' own database (Oct 19 2026); empty means the main one.
      DATABASE_LCA_URL: ${{ secrets.DATABASE_LCA_URL }}
      DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Dump
        working-directory: v2
        # Exits non-zero on a short table, so an empty dump cannot upload as
        # if it were a backup.
        run: python3 scripts/dump_observations.py --out "${RUNNER_TEMP}/observations"

      - name: Seal
        working-directory: v2
        run: |
          o="$RUNNER_TEMP/observations"
          s="$RUNNER_TEMP/sealed"
          mkdir -p "$s"
          tar -C "$o" -cf - . \
            | openssl cms -encrypt -binary -aes-256-gcm -outform DER \
                -out "$s/observations.tar.cms" scripts/oracle/conf/backup-recipient.pem
          rm -rf "$o"
          test -s "$s/observations.tar.cms" || { echo "::error::nothing sealed"; exit 1; }
          echo "sealed: $(du -h "$s/observations.tar.cms" | cut -f1)"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: observations-${{ github.run_id }}
          path: ${{ runner.temp }}/sealed
          retention-days: 90
          if-no-files-found: error

      - name: Record the failure where the health check will see it
        if: failure() || cancelled()
        working-directory: v2
        run: |
          python3 scripts/record_ingest_failure.py \
            --script dump_observations.py \
            --status "${{ job.status == 'cancelled' && 'cancelled' || 'failed' }}" \
            --note "backup-observations: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
