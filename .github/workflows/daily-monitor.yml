name: Daily monitor

# The morning report: health, bills, every workflow run, the ingests, failures
# and re-runs, the data, traffic, what was expected and what was not. Emailed
# to the admin address every morning.
#
# scripts/daily_monitor.py gathers what lives outside Convex into a JSON file;
# `dailyReport:send` adds what only Convex can see, stores the report for the
# admin page's Monitor tab and emails it.
#
# THIS REPOSITORY IS PUBLIC, SO ITS LOGS ARE. The script prints one status word
# per section and the report travels in a file and a command argument that the
# log shows unexpanded. Nothing here may `cat` the report or echo it.
#
# Dispatched by the server's timer (daily-monitor in src/app/api/cron/dispatch/
# jobs.ts), because GitHub's own schedule fires hours late on this repo. No
# GitHub schedule on purpose: two clocks would mean two emails. A missing
# morning email is itself the alarm, and the review routine says so.
#
# Optional secrets, each switching on one section (the report says "off" until
# it is set): POSTHOG_PERSONAL_API_KEY, SENTRY_AUTH_TOKEN.
#
# Before the report, every check that reads rendered pages runs against the live
# site (scripts/page_checks.py): glued words, content hidden until scripts run,
# headings, titles and canonicals, internal links, figures typed into the copy,
# axe, phone widths and the browser flows. They had run only by hand (found Oct
# 25 2026). The report prints one line per check, and a failed check turns this
# run red at the end, after the email has gone.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  # The security section: open code-scanning alerts, Dependabot alerts and
  # Dependabot's update pull requests (scripts/daily_monitor.py, security_section),
  # beside `pnpm audit` over the lockfile.
  security-events: read
  vulnerability-alerts: read
  pull-requests: read

concurrency:
  group: daily-monitor
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      # The security section runs `pnpm audit`, which reads the lockfile alone:
      # pnpm and Node, no install.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: v2/package.json
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x

      # The browser checks (axe, the phone sweep, the browser flows) need the
      # site's packages; Chrome itself is on GitHub's runner image.
      - name: Install the site's packages
        working-directory: v2
        run: pnpm install --frozen-lockfile

      - name: Check the live pages
        working-directory: v2
        env:
          DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          DATABASE_LCA_URL: ${{ secrets.DATABASE_LCA_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          code=0
          python3 scripts/page_checks.py --base https://permtracker.app --out "${RUNNER_TEMP}/page-checks.json" || code=$?
          echo "$code" > "${RUNNER_TEMP}/page-checks.exit"

      - name: Gather the report
        working-directory: v2
        env:
          DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          # The H-1B LCA filings' own database (Oct 19 2026); empty means the main one.
          DATABASE_LCA_URL: ${{ secrets.DATABASE_LCA_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          PAGE_CHECKS_FILE: ${{ runner.temp }}/page-checks.json
        run: python3 scripts/daily_monitor.py --out "${RUNNER_TEMP}/report.json"

      - name: Add Convex's half, store it and email it
        working-directory: v2
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          python3 -c 'import json,sys; json.dump({"report": json.load(open(sys.argv[1]))}, open(sys.argv[2], "w"))' \
            "${RUNNER_TEMP}/report.json" "${RUNNER_TEMP}/args.json"
          npx --yes convex run dailyReport:send "$(cat "${RUNNER_TEMP}/args.json")" --prod

      # The checks carry on so the report still goes out; a failed one still
      # ends this run red, so the failure shows in the Actions list too.
      - name: A failed page check turns the run red
        if: ${{ always() }}
        run: |
          code=$(cat "${RUNNER_TEMP}/page-checks.exit" 2>/dev/null || echo missing)
          echo "page checks exit: $code"
          test "$code" = 0
