name: Semgrep

on:
  push:
    branches: [main]
  pull_request: {}
  schedule:
    - cron: "20 17 * * 1" # Weekly Monday (same cadence as CodeQL)
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep
    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Semgrep
        # Two rules are structurally wrong for this repository and are excluded
        # rather than dismissed one alert at a time:
        # sqlalchemy-execute-raw-query fires on every `db.execute(sql)` of the
        # libSQL HTTP helper in scripts/lib_turso.py, and there is no SQLAlchemy
        # here; dynamic-urllib-use-detected fires on every ingest that fetches
        # a URL held in a constant or read from our own tables. Real SQL and
        # URL findings still come from CodeQL and the formatted-sql-query rule.
        run: >-
          semgrep ci --sarif-output=semgrep.sarif
          --exclude-rule=python.sqlalchemy.security.sqlalchemy-execute-raw-query.sqlalchemy-execute-raw-query
          --exclude-rule=python.lang.security.audit.dynamic-urllib-use-detected.dynamic-urllib-use-detected
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: semgrep.sarif
        if: always() && hashFiles('semgrep.sarif') != ''
