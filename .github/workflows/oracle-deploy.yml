name: Oracle build and deploy

# Builds the site on GitHub's free ARM runner (4 cores, 16 GB; the Oracle
# server is ARM too, so sharp and libsql get the right native binaries) and
# ships it to the Oracle server, where `permtracker-deploy` starts it on the
# idle copy, health-checks it and only then moves traffic to it.
#
# THIS REPOSITORY IS PUBLIC, SO ITS LOGS ARE. Nothing here prints a secret.
# The deploy key can do exactly two things on the server (see
# /home/deploy/.ssh/authorized_keys there): run the deploy script, and open a
# tunnel to the database port, which the build uses to prerender pages with
# the READ-ONLY token.

on:
  push:
    branches: [main]
    # A push that cannot change the built site does not rebuild it.
    paths-ignore:
      - "**/*.md"
      - "v2/scripts/**"
      - ".planning/**"
      - "docs/**"
      - "v2/docs/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read
  # To read whether the test suite passed for this commit (the wait below).
  actions: read

concurrency:
  group: oracle-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    defaults:
      run:
        working-directory: v2
    env:
      NODE_OPTIONS: --max-old-space-size=12288
      NEXT_TELEMETRY_DISABLED: "1"
      # One name per run: a second run on the same commit reused the live
      # release's name on Oct 8 2026 and the server deleted the live folder
      # (permtracker-deploy now refuses a name a slot runs from).
      DEPLOYMENT_ID: ${{ github.sha }}-${{ github.run_number }}
      VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
      NEXT_PUBLIC_VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole history, without file contents: the sitemap dates each
          # page by its last change in git (scripts/page_dates.mjs).
          fetch-depth: 0
          filter: blob:none
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: v2/package.json
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Open the database tunnel (read-only token, prerender only)
        env:
          ORACLE_DEPLOY_KEY: ${{ secrets.ORACLE_DEPLOY_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=20 -f -N -L 18080:127.0.0.1:8080 "deploy@$ORACLE_HOST"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/v2/pipeline -d '{}')
          echo "database tunnel answered HTTP $code (401 = reached, login required)"
          test "$code" = "401"

      - name: Date each page by its last change (the sitemap's lastmod)
        run: node scripts/page_dates.mjs

      # The compiler's cache from the last deploy: webpack's module cache and
      # TypeScript's incremental build info. Without it every build compiled
      # from nothing ("No build cache found": compile 2.4 min, TypeScript 43 s
      # on Oct 8 2026). Only those two, never all of .next/cache: its fetch and
      # data caches hold saved answers for up to a week, and a build that
      # restored them would prerender pages from last week's figures. Each
      # deploy saves its own entry (keyed by commit) and restores the newest
      # entry for the same lockfile.
      - name: Restore the compiler's cache from the last deploy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            v2/.next/cache/webpack
            v2/.next/cache/.tsbuildinfo
          key: next-compile-${{ runner.arch }}-${{ hashFiles('v2/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-compile-${{ runner.arch }}-${{ hashFiles('v2/pnpm-lock.yaml') }}-

      - name: Build
        env:
          TURSO_DATABASE_URL: http://127.0.0.1:18080
          TURSO_AUTH_TOKEN: ${{ secrets.ORACLE_DB_RO_TOKEN }}
        run: pnpm build

      - name: Package the standalone server
        run: |
          S=$(dirname "$(find .next/standalone -name server.js -not -path '*/node_modules/*' | head -1)")
          test -f "$S/server.js"
          cp -r .next/static "$S/.next/static"
          cp -r public "$S/public"
          tar --zstd -cf "$RUNNER_TEMP/release.tar.zst" -C "$S" .
          echo "release: $(du -h "$RUNNER_TEMP/release.tar.zst" | cut -f1), server at ${S#.next/standalone}"

      # The build runs while the test suite does (test.yml, about 4 minutes in
      # three parts); nothing reaches the server until the suite has passed
      # for this exact commit. A failed or cancelled suite stops the deploy
      # here, with the live site untouched.
      - name: Wait for the full test suite to pass for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 120); do
            line=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion) \(.html_url)"' 2>/dev/null || true)
            set -- $line
            if [ "${1:-}" = completed ]; then
              if [ "${2:-}" = success ]; then echo "the full suite passed: $3"; exit 0; fi
              echo "::error::the test suite did not pass for this commit (${2:-unknown}): ${3:-}"; exit 1
            fi
            [ "$i" = 1 ] && echo "waiting for the test suite (${1:-not started})"
            sleep 15
          done
          echo "::error::the test suite had not finished 30 minutes after the build"; exit 1

      - name: Deploy to the idle copy, health-check, switch
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o ServerAliveInterval=20 \
            "deploy@$ORACLE_HOST" "deploy ${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}" < "$RUNNER_TEMP/release.tar.zst"

      # Cloudflare keeps each page's HTML up to a day (s-maxage=86400) and a
      # deploy does not clear it, so a fix shipped here stayed invisible until
      # the copy expired (Oct 5 2026). This drops the copies of exactly the
      # pages the push changed. Skips cleanly without the secrets, on a manual
      # run (no "before"), and never fails the deploy.
      - name: Drop Cloudflare's copies of the pages this push changed
        continue-on-error: true
        env:
          CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "no previous commit to compare with; skipping the purge"; exit 0
          fi
          node scripts/gsc_queue.mjs --since "$BEFORE" --purge

      - name: Close the tunnel
        if: always()
        run: pkill -f "18080:127.0.0.1:8080" || true
