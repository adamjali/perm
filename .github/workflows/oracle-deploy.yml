name: Oracle build and deploy
# A push is titled by its commit; a dispatch by when it ships, which the
# server's night timer reads to skip a duplicate (src/app/api/cron/dispatch/jobs.ts).
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Oracle build and deploy, {0}', inputs.when || 'now') || github.event.head_commit.message }}

# Builds the site on GitHub's free ARM runner (4 cores, 16 GB; the Oracle
# server is ARM too, so sharp and libsql get the right native binaries) and
# ships it to the Oracle server, where `permtracker-deploy` starts it on the
# idle copy, health-checks it and only then moves traffic to it.
#
# THIS REPOSITORY IS PUBLIC, SO ITS LOGS ARE. Nothing here prints a secret.
# The deploy key can do exactly two things on the server (see
# /home/deploy/.ssh/authorized_keys there): run the deploy script, and open a
# tunnel to the database port, which the build uses to prerender pages with
# the READ-ONLY token.
#
# THE SITE GOES LIVE AT NIGHT (owner's call, Oct 18 2026; scripts/deploy_plan.py
# decides and says why). Every deploy empties the page cache while crawlers keep
# asking, and 8 of 13 people shown the busy page in 36 hours came within an hour
# of one. A push outside 1 to 5 AM Eastern builds (so a broken build still shows
# in the day) and stops there; the server's timer dispatches `when=night` at
# 06:00 UTC, which ships main if the site changed since what's live. For an
# urgent fix: `gh workflow run oracle-deploy.yml -f when=now`.

on:
  push:
    branches: [main]
    # A push that cannot change the built site does not rebuild it. Read in
    # order, the last match winning (GitHub's own rule for `paths`): every
    # file, less what a build never reads, then this workflow back in. A
    # change to any other workflow had shipped the site and emptied its page
    # cache (dol-perm-files.yml, Oct 21 2026). scripts/deploy_plan.py reads
    # the same list.
    paths:
      - "**"
      - "!**/*.md"
      - "!v2/scripts/**"
      - "!v2/workers/**"
      - "!v2/**/__tests__/**"
      - "!v2/**/*.test.ts"
      - "!v2/**/*.test.tsx"
      - "!.planning/**"
      - "!docs/**"
      - "!v2/docs/**"
      - "!.github/**"
      - ".github/workflows/oracle-deploy.yml"
  workflow_dispatch:
    inputs:
      when:
        description: "now ships as soon as the tests pass; night ships only what changed since the live commit"
        type: choice
        options: [now, night]
        default: now

permissions:
  contents: read
  # To read whether the test suite passed for this commit (the wait below).
  actions: read

concurrency:
  group: oracle-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    defaults:
      run:
        working-directory: v2
    env:
      NODE_OPTIONS: --max-old-space-size=12288
      NEXT_TELEMETRY_DISABLED: "1"
      # One name per run: a second run on the same commit reused the live
      # release's name on Oct 8 2026 and the server deleted the live folder
      # (permtracker-deploy now refuses a name a slot runs from).
      DEPLOYMENT_ID: ${{ github.sha }}-${{ github.run_number }}
      VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
      NEXT_PUBLIC_VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole history, without file contents: the sitemap dates each
          # page by its last change in git (scripts/page_dates.mjs).
          fetch-depth: 0
          filter: blob:none
      - name: Set up the deploy key
        env:
          ORACLE_DEPLOY_KEY: ${{ secrets.ORACLE_DEPLOY_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # What's live comes from the server, not from the last successful run: a
      # push held for the night succeeds too, and a deploy held by a red test
      # leaves its changes unshipped, so the next one has to warm and purge
      # those pages as well (Oct 9 2026: Cloudflare kept serving the old
      # employers-under-review page). An unreadable answer falls back to the
      # push's previous commit, and a night run then ships.
      - name: Decide whether this run builds and ships
        id: plan
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          EVENT: ${{ github.event_name }}
          WHEN: ${{ inputs.when }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o ConnectTimeout=20 "deploy@$ORACLE_HOST" status > "$RUNNER_TEMP/live-status.txt" 2>/dev/null || true
          STATUS_FILE="$RUNNER_TEMP/live-status.txt" python3 scripts/deploy_plan.py
          echo "SINCE=$(grep '^since=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)" >> "$GITHUB_ENV"
      - name: Install pnpm
        if: steps.plan.outputs.build == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: v2/package.json
      - name: Setup Node
        if: steps.plan.outputs.build == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml
      - name: Install dependencies
        if: steps.plan.outputs.build == 'true'
        run: pnpm install --frozen-lockfile

      - name: Open the database tunnel (read-only token, prerender only)
        if: steps.plan.outputs.build == 'true'
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          # Two ports: the main database and, since Oct 19 2026, the H-1B LCA
          # filings' own (permtracker-db-lca), which the build reads once the
          # repository variable ORACLE_DB_LCA is "on". The deploy key's
          # permitopen allows exactly these two.
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=20 -f -N -L 18080:127.0.0.1:8080 -L 18082:127.0.0.1:8082 "deploy@$ORACLE_HOST"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/v2/pipeline -d '{}')
          echo "database tunnel answered HTTP $code (401 = reached, login required)"
          test "$code" = "401"
          if [ "${{ vars.ORACLE_DB_LCA }}" = "on" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18082/v2/pipeline -d '{}')
            echo "LCA database tunnel answered HTTP $code"
            test "$code" = "401"
          fi

      - name: Date each page by its last change (the sitemap's lastmod)
        if: steps.plan.outputs.build == 'true'
        run: node scripts/page_dates.mjs

      # TypeScript's incremental build info from the last deploy: the build's
      # type check went from 45 s to 6 s with it (Oct 8 2026). Webpack's own
      # cache is NOT kept: its key includes the server-actions encryption key,
      # which Next generates fresh for every build, so a restored cache never
      # matched (compile 2.6 min with it and without), and pinning that key
      # would put a copy of it in a cache forked pull requests can read. Never
      # the rest of .next/cache either: its data cache holds saved answers for
      # up to a week, and a build that restored it would prerender old figures.
      - name: Restore TypeScript's build info from the last deploy
        if: steps.plan.outputs.build == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: v2/.next/cache/.tsbuildinfo
          key: next-tsbuildinfo-${{ runner.arch }}-${{ hashFiles('v2/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-tsbuildinfo-${{ runner.arch }}-${{ hashFiles('v2/pnpm-lock.yaml') }}-

      - name: Build
        if: steps.plan.outputs.build == 'true'
        env:
          DATABASE_URL: http://127.0.0.1:18080
          DATABASE_LCA_URL: ${{ vars.ORACLE_DB_LCA == 'on' && 'http://127.0.0.1:18082' || '' }}
          DATABASE_AUTH_TOKEN: ${{ secrets.ORACLE_DB_RO_TOKEN }}
          # Names withheld at a person's request (src/lib/privacy/withheld.ts):
          # the build prerenders pages too, so it needs the list the server has.
          WITHHELD_EMPLOYERS: ${{ secrets.WITHHELD_EMPLOYERS }}
        run: pnpm build

      # A placeholder wider than its box on a 320px phone stops saying what the
      # box takes. The audit measures each with the Inter file this build ships,
      # so it runs here, where that file exists (it had run only by hand until
      # Oct 25 2026, and four had grown too wide). A push builds at once, so a
      # failure shows in the day, before the night run.
      - name: Placeholders fit their boxes
        if: steps.plan.outputs.build == 'true'
        run: |
          python3 -m pip install --quiet "fonttools[woff]"
          python3 scripts/audit_placeholders.py

      - name: Package the standalone server
        if: steps.plan.outputs.build == 'true'
        env:
          BEFORE: ${{ env.SINCE }}
        run: |
          S=$(dirname "$(find .next/standalone -name server.js -not -path '*/node_modules/*' | head -1)")
          test -f "$S/server.js"
          cp -r .next/static "$S/.next/static"
          cp -r public "$S/public"
          # The pages this push changed, which the server warms before the
          # rest: the same list the Cloudflare step below drops copies of. None
          # on a manual run (no "before"); a failure here never fails the deploy.
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            node scripts/gsc_queue.mjs --since "$BEFORE" --warm-list > "$S/warm-first.txt" 2>/dev/null || : > "$S/warm-first.txt"
            echo "warm first: $(grep -c . "$S/warm-first.txt" || true) changed pages and families"
          fi
          tar --zstd -cf "$RUNNER_TEMP/release.tar.zst" -C "$S" .
          echo "release: $(du -h "$RUNNER_TEMP/release.tar.zst" | cut -f1), server at ${S#.next/standalone}"

      # The build runs while the test suite does (test.yml, about 4 minutes in
      # three parts); nothing reaches the server until the suite has passed
      # for this exact commit. A failed or cancelled suite stops the deploy
      # here, with the live site untouched.
      - name: Wait for the full test suite to pass for this commit
        if: steps.plan.outputs.ship == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 120); do
            line=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion) \(.html_url)"' 2>/dev/null || true)
            set -- $line
            if [ "${1:-}" = completed ]; then
              if [ "${2:-}" = success ]; then echo "the full suite passed: $3"; exit 0; fi
              echo "::error::the test suite did not pass for this commit (${2:-unknown}): ${3:-}"; exit 1
            fi
            [ "$i" = 1 ] && echo "waiting for the test suite (${1:-not started})"
            sleep 15
          done
          echo "::error::the test suite had not finished 30 minutes after the build"; exit 1

      - name: Deploy to the idle copy, health-check, switch
        if: steps.plan.outputs.ship == 'true'
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o ServerAliveInterval=20 \
            "deploy@$ORACLE_HOST" "deploy ${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}" < "$RUNNER_TEMP/release.tar.zst"

      # Cloudflare keeps each page's HTML up to a day (s-maxage=86400) and a
      # deploy does not clear it, so a fix shipped here stayed invisible until
      # the copy expired (Oct 5 2026). This drops the copies of exactly the
      # pages the push changed. Skips cleanly without the secrets, on a manual
      # run (no "before"), and never fails the deploy; a refusal fails this
      # step, so it shows.
      - name: Drop Cloudflare's copies of the pages this push changed
        if: steps.plan.outputs.ship == 'true'
        continue-on-error: true
        env:
          CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          BEFORE: ${{ env.SINCE }}
        run: |
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "no previous commit to compare with; skipping the purge"; exit 0
          fi
          node scripts/gsc_queue.mjs --since "$BEFORE" --purge

      # Names withheld at a person's request (scripts/withhold.py,
      # docs/PRIVACY_REMOVALS.md): drop Cloudflare's copies of every page that
      # showed one, on every deploy. Prints counts only, never a page, because
      # this log is public. Never fails the deploy; a refusal shows red here.
      - name: Drop Cloudflare's copies of pages a withheld name was on
        if: steps.plan.outputs.ship == 'true'
        continue-on-error: true
        env:
          WITHHELD_EMPLOYERS: ${{ secrets.WITHHELD_EMPLOYERS }}
          CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          DATABASE_URL: http://127.0.0.1:18080
          DATABASE_AUTH_TOKEN: ${{ secrets.ORACLE_DB_RO_TOKEN }}
        run: python3 scripts/withhold.py purge

      # IndexNow (Bing, Yandex, Seznam, and the AI search products Bing's index
      # feeds) hears which pages this deploy changed, and only those: its FAQ
      # says "Submit only when content has changed". It runs here rather than
      # in a workflow that waits for this one, because a run that succeeded no
      # longer means a deploy: a push held for the night succeeds too. A manual
      # run of indexnow.yml still sends every URL. Never fails the deploy.
      - name: Tell IndexNow which pages this deploy changed
        if: steps.plan.outputs.ship == 'true'
        continue-on-error: true
        env:
          BEFORE: ${{ env.SINCE }}
        run: |
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "no previous commit to compare with; skipping"; exit 0
          fi
          node scripts/gsc_queue.mjs --since "$BEFORE" --indexnow-list > "$RUNNER_TEMP/indexnow-urls.txt"
          echo "$(wc -l < "$RUNNER_TEMP/indexnow-urls.txt" | tr -d ' ') page(s) changed since ${BEFORE::12}"
          node scripts/indexnow.mjs --urls "$RUNNER_TEMP/indexnow-urls.txt"

      - name: Close the tunnel
        if: always()
        run: pkill -f "18080:127.0.0.1:8080" || true
