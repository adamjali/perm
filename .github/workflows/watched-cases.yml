name: Watched cases (hourly)

# Asks DOL, every hour, about only the cases someone has an alert on. The full
# and pending sweeps check every case twice a day, so without this a watched
# case could move and its subscriber hear up to twelve hours later. Dispatched
# hourly at :25 by the server's timer (/api/cron/dispatch/watched-cases).
#
#   1. Skip the hour if a sweep is running: it covers these cases anyway.
#   2. Read the watched list from Convex (case numbers only, never an address).
#   3. Ask DOL about those numbers alone and write any move through the same
#      tables the sweeps use (check_watched_cases.py's writes are conditional,
#      so a sweep that got there first is harmless).
#   4. If anything moved, run the email and browser-push alert sweeps now
#      instead of at their next scheduled tick.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: watched-cases
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x

      - name: Check watched cases
        working-directory: v2
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in case-status-direct.yml pwd-status-direct.yml; do
            n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --status in_progress \
                  --limit 1 --json databaseId --jq length || echo 0)
            if [ "${n:-0}" -gt 0 ]; then
              echo "$wf is running; it covers these cases this hour"
              exit 0
            fi
          done
          npx --yes convex@1.46.0 run watchedCases:watchedCaseNumbers '{}' > "$RUNNER_TEMP/watched.json"
          python3 scripts/check_watched_cases.py "$RUNNER_TEMP/watched.json" | tee "$RUNNER_TEMP/out.txt"
          changed=$(grep -oE '^CHANGED=[0-9]+' "$RUNNER_TEMP/out.txt" | cut -d= -f2)
          if [ "${changed:-0}" -gt 0 ]; then
            echo "$changed watched case(s) moved; running the alert sweeps now"
            npx --yes convex@1.46.0 run caseAlerts:sweepCaseChanges '{}'
            npx --yes convex@1.46.0 run casePushAlertsSweep:sweep '{}'
          fi
