name: Newsworthy check

# The evening check: what moved since the morning report (a rule's step at OIRA
# or in the Federal Register, a DOL processing-times month, a new visa bulletin,
# a big employer-wide move, an unusual decision day), emailed to the owner only
# when something did. scripts/newsworthy.py decides (scripts/lib_newsworthy.py,
# tested in scripts/test_newsworthy.py); convex/newsworthy.ts sends through the
# owner-mail path. The morning report carries the same check as its first
# section.
#
# THIS LOG IS PUBLIC: the script prints one word and the Convex call's output
# is discarded, so no line or figure reaches it.
#
# The server's timer dispatches this daily at 00:30 UTC through
# /api/cron/dispatch (8:30 PM EDT, 7:30 PM EST).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newsworthy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: What moved since the morning
        id: gather
        working-directory: v2
        env:
          DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python3 scripts/newsworthy.py --out "${RUNNER_TEMP}/news.json"

      - name: Install pnpm
        if: steps.gather.outputs.found == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: v2/package.json
      - name: Setup Node
        if: steps.gather.outputs.found == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
      - name: Install the site's packages
        if: steps.gather.outputs.found == 'true'
        working-directory: v2
        run: pnpm install --frozen-lockfile

      - name: Email the owner
        if: steps.gather.outputs.found == 'true'
        working-directory: v2
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          python3 -c 'import json,sys; json.dump({"news": json.load(open(sys.argv[1]))}, open(sys.argv[2], "w"))' \
            "${RUNNER_TEMP}/news.json" "${RUNNER_TEMP}/args.json"
          if npx --yes convex run newsworthy:send "$(cat "${RUNNER_TEMP}/args.json")" --prod > "${RUNNER_TEMP}/send.out" 2>&1; then
            grep -Eq '"?emailed"?: *true' "${RUNNER_TEMP}/send.out" && echo "emailed" || { echo "::error::the email didn't go"; exit 1; }
          else
            echo "::error::the Convex call failed (its output is withheld: this log is public)"; exit 1
          fi
