name: Ingest health

# The daily alarm for the ingests. A failed ingest step is often allowed to
# exit green, and the staleness note a page renders is something nobody
# watches, so without this a dead ingest would leave the site serving the last
# good numbers under their own as-of date indefinitely.
#
# check_ingest_health.py fails when a dataset is past the freshness budget its
# own ingest declared, when an ingest's latest run did not finish clean, or
# when the discovery walk has stopped moving. A red run is what triggers
# GitHub's notification to the repo owner, so this needs no other alerting
# service. Deliberately not continue-on-error: failing is the feature.
#
# Two clocks on purpose: the server's timer dispatches this at 10:00 UTC
# through /api/cron/dispatch, and the GitHub schedule below is a second,
# independent one, so a stopped server clock is itself reported.
#
# Manual run:
#   cd v2 && python3 scripts/check_ingest_health.py

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest-health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Check every dataset against its own freshness budget
        working-directory: v2
        run: python3 scripts/check_ingest_health.py

      # The health check asks whether the jobs ran and moved. This asks whether
      # the data they wrote has the shape the code assumes: no foreign prefixes
      # in the PERM tables, every status in a known vocabulary, filing dates
      # that agree with the case number, a consistent alias table, no
      # duplicate indexes.
      - name: Check the data's invariants
        if: ${{ !cancelled() }}
        working-directory: v2
        run: python3 scripts/check_invariants.py
