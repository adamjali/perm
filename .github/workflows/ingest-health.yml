name: Ingest health

# THE ONLY THING THAT WILL TELL US AN INGEST HAS STOPPED.
#
# Before this, a dead ingest was silent. Four of the six ingest workflows mark
# their step `continue-on-error: true`, so a failed run exits GREEN and GitHub
# sends nothing. The other signal - the staleness warning `DataProvenance`
# renders - appears on a page, and nobody watches pages. So if permtrack
# changed shape, DOL moved a file, or a token expired, the site would keep
# serving the last good numbers under their own as-of date indefinitely and
# nothing would say otherwise. That is worse than an outage: an outage is
# visible.
#
# This reads every row of `data_freshness` and fails when any dataset is past
# the `max_age_days` ITS OWN INGEST declared. A red scheduled run is what
# triggers GitHub's built-in notification to the repo owner, so this needs no
# new alerting service and no extra credential.
#
# Deliberately NOT continue-on-error. Failing is the entire feature.
#
# Manual run:
#   cd v2 && python3 scripts/check_ingest_health.py

on:
  schedule:
    # 10:00 UTC - after the daily ingests (07:00 processing times, 09:30 month
    # stats) so a same-day failure is caught the same day rather than tomorrow.
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest-health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Check every dataset against its own freshness budget
        working-directory: v2
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          printf 'TURSO_DATABASE_URL=%s\nTURSO_AUTH_TOKEN=%s\n' \
            "$TURSO_DATABASE_URL" "$TURSO_AUTH_TOKEN" > .env.local
          python3 scripts/check_ingest_health.py

      # The health check asks whether the jobs ran and moved. This asks whether
      # the data they wrote has the shape the code assumes: no foreign prefixes
      # in the PERM tables, every new status in a known vocabulary, filing
      # dates that agree with the case number, a consistent alias table, no
      # duplicate indexes. Each of those was broken and green on Sep 6 2026.
      - name: Check the data's invariants
        if: ${{ !cancelled() }}
        working-directory: v2
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          printf 'TURSO_DATABASE_URL=%s\nTURSO_AUTH_TOKEN=%s\n' \
            "$TURSO_DATABASE_URL" "$TURSO_AUTH_TOKEN" > .env.local
          python3 scripts/check_invariants.py

      - name: Remove credentials
        if: always()
        working-directory: v2
        run: rm -f .env.local
