name: Tests

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + Vitest
    runs-on: ubuntu-24.04
    # All app code lives in v2/, so every step runs from there.
    defaults:
      run:
        working-directory: v2

    env:
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # A `uses:` step ignores the job's working directory and would read
          # the repo root's package.json; the `packageManager` pin is in v2/.
          package_json_file: v2/package.json

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The data scripts have no typechecker and nothing in the app imports
      # them, so a NameError would otherwise wait for the night a script runs.
      # Any finding fails: the tree is clean, so a new one is a regression.
      - name: Lint the data scripts
        run: |
          pipx run pyflakes scripts/*.py scripts/oracle/*.py
          # A linter that found nothing and one that never ran look the same.
          n=$(ls scripts/*.py scripts/oracle/*.py | wc -l)
          echo "pyflakes clean across $n scripts"
          [ "$n" -ge 50 ] || { echo "::error::only $n scripts seen; the glob is wrong"; exit 1; }

      # Every script test, found by name, so a new test runs the day it lands,
      # and all of them run even after one fails. None touches the network: each
      # substitutes the far end. openpyxl reads the spreadsheets, pdfplumber the
      # PDFs.
      - name: Data script tests
        if: ${{ !cancelled() }}
        run: |
          python3 -m pip install --quiet openpyxl pdfplumber
          n=0; failed=0
          for t in scripts/test_*.py scripts/oracle/test_*.py; do
            n=$((n + 1))
            echo "::group::$t"
            python3 "$t" || { echo "::error::$t failed"; failed=$((failed + 1)); }
            echo "::endgroup::"
          done
          echo "$n script tests, $failed failed"
          [ "$n" -ge 40 ] || { echo "::error::only $n tests found; the glob is wrong"; exit 1; }
          [ "$failed" -eq 0 ]

      - name: Run full test suite
        # Runs even when a script test failed, so one gate can't hide another;
        # the failed step still fails the job. --retry=2 re-runs only a test
        # that fails, a net for rare runner hiccups in a deterministic suite.
        if: ${{ !cancelled() }}
        run: pnpm test:run --retry=2
