name: Tests

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + Vitest
    runs-on: ubuntu-latest
    # All app code lives in v2/ — run every step from there.
    defaults:
      run:
        working-directory: v2

    env:
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # action-setup is a `uses:` step, so the job's working-directory:v2
          # default does NOT apply — it reads the repo-root package.json by
          # default. Point it at v2/ where the `packageManager` pin lives.
          package_json_file: v2/package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The ingest scripts have no typechecker, and nothing else in CI ever
      # imports them: a NameError sits in one until the night it runs. Three
      # of the eight freshness stamps shipped with an undefined `db` and would
      # have died on their last line, under `continue-on-error: true`, in
      # total silence - the monitor built to catch a silent ingest failure was
      # itself failing silently. F821 is the whole point; the unused-import
      # codes are pre-existing noise and stay off.
      - name: Lint ingest scripts for undefined names
        working-directory: v2
        run: |
          pipx run pyflakes scripts/*.py 2>&1 | tee /tmp/pf.txt || true
          if grep -qE "undefined name|invalid syntax" /tmp/pf.txt; then
            echo "::error::An ingest script references a name that does not exist."
            grep -E "undefined name|invalid syntax" /tmp/pf.txt
            exit 1
          fi
          # A linter that found nothing and a linter that never ran look the
          # same. Prove it parsed the files.
          n=$(ls scripts/*.py | wc -l)
          echo "  pyflakes clean across $n scripts"
          [ "$n" -ge 10 ] || { echo "::error::only $n scripts seen; the glob is wrong"; exit 1; }

      # The parser between a saved government page and a published cutoff
      # date. Every guard in it protects against a PLAUSIBLE WRONG ANSWER
      # rather than an error: a reordered column publishes India's cutoff as
      # China's, and a misread month files October under September. Neither
      # looks broken on the page.
      - name: Visa bulletin parser contract
        working-directory: v2
        run: python3 scripts/test_visa_bulletin.py

      # The ingest that talks to DOL unattended. Every case in here is a
      # defect that happened or would have shipped silently - the batch
      # ceiling that truncates without erroring, the retry that stops a
      # transient blip from dropping 50 cases, and the flush that must clear
      # what it wrote or the next one re-sends it. No network: lookup is
      # substituted, so CI never adds load to a government host.
      - name: Direct case-status ingest contract
        working-directory: v2
        run: python3 scripts/test_case_status_direct.py

      # The sweep's own record of what it checked, and the freshness claim it
      # replaced. `perm_case_status.last_checked_at` is permtrack's column,
      # never written by our PERM sweep, and the review-stage doc used to
      # publish MIN/MAX of it as "when we read these stages" - 66,771 pending
      # cases carrying a July date on a morning the sweep had checked every
      # one. These run the REAL SQL against in-memory SQLite, so a typo in the
      # CTE fails here rather than in production. No network.
      - name: Sweep coverage record
        working-directory: v2
        run: python3 scripts/test_sweep_runs.py

      # Surviving a transient far-end failure, and saying so when it does not.
      #
      # On 2026-09-03 both DOL sweeps died on `SQLITE_NOMEM` two minutes apart
      # and NOTHING reported it: the case-status run had stamped itself fresh
      # and written an `ok` audit row 80 seconds before it crashed, and all 36
      # rows in `ingest_runs` said `ok`. Two halves, tested separately:
      #
      #   resilience  the retry only fires for the transient class, and the
      #               two AUTOINCREMENT writers still land exactly one row
      #               through an applied-then-failed error
      #   health      a `failed` or `partial` run turns the daily health run
      #               red, a `cancelled` one does not, and a later success
      #               clears the flag
      #
      # No network in either. Both were dead code until this step existed - a
      # control that has never run is not a control.
      - name: Ingest resilience and failure visibility
        working-directory: v2
        run: |
          python3 scripts/test_ingest_resilience.py
          python3 scripts/test_ingest_health.py

      # The nightly diff on perm_live_recent (~137k rows). A diff that never
      # matches is not slow, it is absent - and it logs "ok" while rewriting
      # every row, which is what shipped for one run when libSQL's
      # integers-as-strings met a freshly built int. No network.
      - name: Live-recent diff contract
        working-directory: v2
        run: |
          python3 scripts/test_live_recent.py
          python3 scripts/test_flag_disclosure.py
          python3 scripts/test_pwd_status.py

      # The observed-decision series: our own half of `daily_decisions`.
      #
      # `daily_decisions` held three sources and read one. Two are now deleted:
      # `permtrack` was the rival's series, overlapping ours on 88 dates and
      # double-counting 42,056 decisions in anything that summed the table, and
      # `flag-live` was labelled as our own per-case scan while actually being
      # mirrored from permtrack's daily-summary endpoint two days before our
      # first sweep ever ran. `sweep-observed` replaces them, derived from
      # `perm_case_events` on every sweep.
      #
      # Every guard in here protects against a PLAUSIBLE WRONG NUMBER rather
      # than an error. Dropping the 94,523-row backfill stamp from 2026-08-28
      # leaves 57 decisions on that day - a number that looks like a quiet
      # Friday and is a lie, so the whole day is withheld. The two filters are
      # asserted byte-identical to src/lib/turso/changes.ts, which renders the
      # same rows per case. No network.
      - name: Observed-decision series contract
        working-directory: v2
        run: python3 scripts/test_observed_decisions.py

      # The quarterly Turso load, against a local SQLite stub instead of the
      # real thing. Five bugs in these load steps were each found by
      # dispatching the full 40-minute ingest and reading its log, one bug per
      # run, because the only way to reach three minutes of load work was to
      # re-download 156 MB and re-parse 1.21 GB of XML first. This exercises
      # the same scripts in about two seconds.
      #
      # It asserts what the drop-and-reload bug destroyed: visa_bulletins is an
      # accumulator (84 stored months must survive an artifact carrying 18),
      # perm_docs is shared (we own 3 of 10 keys), a missing bulletin artifact
      # must not sink the corpus load, and a fresh database still builds.
      - name: Quarterly Turso load contract
        working-directory: v2
        run: python3 scripts/test_turso_load.py

      - name: Run full test suite
        # --retry=2 re-runs only individual tests that fail, a safety net against
        # rare CI-environment hiccups. The suite is deterministic (per-file
        # isolation for mock-stateful unit + convex tests, scheduler noise
        # suppressed), so retries should not normally trigger.
        run: pnpm test:run --retry=2
