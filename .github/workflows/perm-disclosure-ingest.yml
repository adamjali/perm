name: Federal data ingest

# Downloads DOL's quarterly PERM disclosure files (www.dol.gov, ~156 MB each,
# over 1 GB of XML uncompressed), reduces them to a payload, loads the case
# corpus into the database and rebuilds everything derived from it. It runs on
# a GitHub runner because the files are far too large for a Convex action, and
# www.dol.gov serves GitHub's runners.
#
# It no longer touches the visa bulletin. A step here read the last 18 months
# from the Internet Archive, but every one of those months already comes from
# the State Department's own pages through the daily direct read
# (processing-times-ingest.yml), which outranks an archive copy; the step only
# ever failed (28 minutes of 429s, then refusals, on Oct 5 2026). Removed Oct 5.
#
# Idempotent: the case load writes only the rows that changed, so an extra run
# costs a download and little else.
#
# Manual run:
#   python3 v2/scripts/ingest_perm_disclosure.py --out /tmp/perm.json

on:
  schedule:
    # The 8th of Jan/Apr/Jul/Oct, a few days after each federal quarter ends,
    # when DOL republishes; and the 20th of every month, to catch a quarter
    # DOL publishes late.
    - cron: "0 6 8 1,4,7,10 *"
    - cron: "0 7 20 * *"
  workflow_dispatch:
    inputs:
      since_fy:
        description: "Earliest fiscal year to union (e.g. 2024). Takes whole years, so the FY2024 old-form/new-form pair is never split."
        required: false
        # Must match what the live corpus spans (decisions from FY2024): a
        # narrower union makes the case table and the published docs describe
        # different populations, which build_state_profiles.py refuses.
        default: "2024"

permissions:
  contents: read

concurrency:
  group: perm-disclosure-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    # A DOL throttle triggers backoff, and the default six hours is far too
    # generous for a job that should either work or fail visibly.
    timeout-minutes: 45
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Download and reduce DOL disclosure files
        working-directory: v2
        # The input reaches the shell through env and is checked against a
        # digit pattern first: interpolating `${{ ... }}` into `run:` would
        # splice a crafted value into the command itself.
        env:
          # The scheduled run has no inputs, so this fallback must match the
          # input's default or a scheduled run and a dispatch build different
          # corpora.
          SINCE_FY: ${{ github.event.inputs.since_fy || '2024' }}
        run: |
          case "$SINCE_FY" in
            ''|*[!0-9]*) echo "FATAL: since_fy must be a 4-digit year" >&2; exit 1 ;;
          esac
          # By year, not by file: DOL published both an old-form and a new-form
          # file for FY2024, and a file count could take only one of the pair.
          python3 scripts/ingest_perm_disclosure.py \
            --since-fy "$SINCE_FY" \
            --out "${RUNNER_TEMP}/perm-payload.json" \
            --cases-out "${RUNNER_TEMP}/perm-cases.ndjson.gz" \
            --wages-out "${RUNNER_TEMP}/perm-wages.json"

      # Fails the job rather than loading a truncated payload. The script
      # already refuses to write an empty one; this catches a partial write.
      - name: Check the payload before loading it
        run: |
          python3 - "${RUNNER_TEMP}/perm-payload.json" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1]))
          cohorts = len(payload["cohorts"])
          frontier = len(payload["frontierHistory"])
          print(f"unique cases    {payload['uniqueCases']:,}")
          print(f"cohorts         {cohorts}")
          print(f"frontier points {frontier}")
          if payload["uniqueCases"] < 50_000 or cohorts < 10 or frontier < 5:
              sys.exit("FATAL: payload is too small to be a real quarter of DOL data")
          PY

      # Kept for a week so a failed load can be finished from the artifact.
      - name: Upload payload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: federal-payloads
          # The case stream is .ndjson.gz; a *.json glob alone would drop the
          # largest thing this job produces.
          path: |
            ${{ runner.temp }}/*.json
            ${{ runner.temp }}/*.ndjson.gz
          retention-days: 7
          if-no-files-found: error

      # The public site reads the database, so after each quarterly release
      # this is what moves it. The derived builders read perm_cases back out of
      # the database, so the two loads land first.
      - name: Load the public corpus
        working-directory: v2
        run: |
          # A shell test rather than an `if:` expression: hashFiles() only sees
          # paths inside the workspace, and RUNNER_TEMP is outside it. A missing
          # payload fails rather than skips, because a quiet skip leaves the
          # public site frozen on the old quarter.
          if [ ! -f "${RUNNER_TEMP}/perm-cases.ndjson.gz" ]; then
            echo "::error::payload missing at ${RUNNER_TEMP}/perm-cases.ndjson.gz; the DOL step should have written it."
            exit 1
          fi
          if [ -z "$TURSO_DATABASE_URL" ] || [ -z "$TURSO_AUTH_TOKEN" ]; then
            echo "::error::database secrets absent; the public site would freeze on the old quarter."
            exit 1
          fi
          # 1. The case rows. --incremental writes only the rows whose
          #    fingerprint changed; it falls back to a full load by itself when
          #    the table is empty.
          python3 scripts/turso_migrate.py "${RUNNER_TEMP}" --incremental
          # 2. Everything else the public pages read: entities, wage cells and
          #    stats, the disclosure-stats document.
          python3 scripts/turso_migrate_public.py "${RUNNER_TEMP}"
          # The loader slugs entities its own way; the alias table remembers
          # slugs from earlier runs. Reconcile so no alias points at a 404.
          python3 scripts/reconcile_entity_aliases.py
          # 3. Derived from the freshly loaded perm_cases.
          python3 scripts/build_entity_detail.py
          # FY2024 onward of each employer's year-by-year record (FY2008 to
          # FY2023 were loaded once by perm-history-ingest.yml).
          python3 scripts/ingest_perm_history.py --current
          # The city, industry and country pages read both case tables.
          python3 scripts/build_groups.py
          # DOL's decisions per day, from both case tables (FY2016 on).
          python3 scripts/build_daily_decisions.py
          python3 scripts/build_alphabet.py
          python3 scripts/build_state_profiles.py
          python3 scripts/build_wage_bands.py
          # Every PERM salary-explorer selection of 5,000+ filings, precomputed
          # (src/lib/turso/wageViews.ts).
          python3 scripts/build_wage_views.py --program perm

      # The pages built from this corpus sit on a week-long window, which is
      # only right if a load expires them. `success()` so a failed load never
      # claims fresh pages.
      - name: Expire the pages built from the quarterly corpus
        if: success()
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "REVALIDATE_SECRET not set; skipping"; exit 0
          fi
          curl -fsS -X POST https://permtracker.app/api/revalidate-disclosure \
            -H "x-revalidate-secret: $REVALIDATE_SECRET" \
            || echo "revalidation call failed"
