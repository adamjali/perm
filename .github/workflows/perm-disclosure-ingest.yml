name: Federal data ingest

# Downloads the quarterly federal datasets this app cites, reduces them to
# aggregates, and stores those in Convex.
#
# Two sources, both quarterly, both reachable to scripts:
#   DOL   PERM disclosure files (www.dol.gov) - 156 MB, 1.21 GB uncompressed
#   USCIS I-140 counts (www.uscis.gov)        - a few hundred KB. Reachable
#         from residential IPs; 403s from GitHub's datacenter range (measured
#         2026-08-24), so the step is non-fatal here and the manual-run path
#         below covers it from a home connection.
#   DOS   visa bulletin, via the Internet Archive - monthly, ~20 KB
#
# USCIS's PROCESSING TIMES are deliberately absent: they live on
# egov.uscis.gov behind a bot challenge and are maintained as a small dated
# table in the app instead.
#
# The visa bulletin comes from the Internet Archive rather than
# travel.state.gov, which refuses automated clients. Reading a public archive
# of a public page is a different thing from defeating a bot protection. The
# trade is freshness: the archive lags by a month or two, so the page built on
# it is framed as a history and labels every figure with its bulletin month.
#
# This runs here rather than in a Convex action because it cannot run there:
# one quarterly file is ~156 MB compressed and **1.21 GB of XML uncompressed**,
# well past what an action can download, hold or parse. A GitHub runner has the
# memory and the time; Convex receives ~5 KB of counts and percentiles.
#
# Quarterly, a few days after each federal quarter ends, because that is when
# DOL republishes. The job is idempotent: the mutation hashes its payload and
# stores nothing when DOL has not changed the files, so an extra run is free.
#
# Manual run:
#   python3 v2/scripts/ingest_perm_disclosure.py --out /tmp/perm.json
#   npx convex run permDisclosure:storeStats "$(cat /tmp/perm.json)" --prod

on:
  schedule:
    # 06:00 UTC on the 8th of Jan/Apr/Jul/Oct, a few days after each federal
    # quarter ends, which is when DOL and USCIS republish.
    - cron: "0 6 8 1,4,7,10 *"
    # The visa bulletin is monthly, and the archive needs time to capture it.
    - cron: "0 7 20 * *"
  workflow_dispatch:
    inputs:
      files:
        description: "How many recent disclosure files to union"
        required: false
        default: "2"

permissions:
  contents: read

concurrency:
  group: perm-disclosure-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # The download plus two streaming parses of ~1.8 GB of XML runs well under
    # this, but a DOL throttle triggers backoff and the default 6h is far too
    # generous for a job that should either work or fail visibly.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Download and reduce DOL disclosure files
        working-directory: v2
        # The dispatch input goes through env and is checked against a digit
        # pattern before it reaches a shell. Interpolating `${{ ... }}` straight
        # into `run:` splices the value into the command itself, so a crafted
        # input would execute rather than be read as an argument.
        env:
          FILE_COUNT: ${{ github.event.inputs.files || '2' }}
        run: |
          case "$FILE_COUNT" in
            ''|*[!0-9]*) echo "FATAL: files must be a positive integer" >&2; exit 1 ;;
          esac
          python3 scripts/ingest_perm_disclosure.py \
            --files "$FILE_COUNT" \
            --out "${RUNNER_TEMP}/perm-payload.json"

      # Fails the job rather than storing a truncated payload. The script
      # already refuses to write an empty one; this catches a partial write.
      - name: Check the payload before sending it
        run: |
          python3 - "${RUNNER_TEMP}/perm-payload.json" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1]))
          cohorts = len(payload["cohorts"])
          frontier = len(payload["frontierHistory"])
          print(f"unique cases    {payload['uniqueCases']:,}")
          print(f"cohorts         {cohorts}")
          print(f"frontier points {frontier}")
          if payload["uniqueCases"] < 50_000 or cohorts < 10 or frontier < 5:
              sys.exit("FATAL: payload is too small to be a real quarter of DOL data")
          PY

      - name: Download and reduce USCIS I-140 counts
        working-directory: v2
        # Non-fatal: www.uscis.gov serves residential IPs and 403s GitHub's
        # datacenter range. An optional source must never sink the DOL store,
        # which is the load-bearing one. The store step checks per-payload.
        continue-on-error: true
        run: |
          python3 scripts/ingest_uscis_i140.py --out "${RUNNER_TEMP}/uscis-payload.json"

      - name: Download the visa bulletin series
        working-directory: v2
        # Non-fatal: the archive is a free public service and a slow day for it
        # must not fail the DOL and USCIS ingests, which are the load-bearing
        # ones. The mutation refuses a short series anyway.
        continue-on-error: true
        run: |
          python3 scripts/ingest_visa_bulletin.py \
            --out "${RUNNER_TEMP}/visa-bulletin.json" --months 18

      # The payloads always survive the run: if the store step cannot run
      # (secret missing) or fails, `gh run download` retrieves them and
      # `npx convex run ...:storeStats` finishes the job from any machine
      # with Convex CLI auth.
      - name: Upload payload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: federal-payloads
          path: ${{ runner.temp }}/*.json
          retention-days: 7
          if-no-files-found: error

      # The entity arrays are now uncapped, and uncapped they do not fit in a
      # Convex document: 12,000 employer rows measured 1.14 MB against a 1 MB
      # limit. So the full set goes to its own table, and the aggregate
      # document keeps only what the index pages render.
      - name: Split the payload
        working-directory: v2
        run: |
          python3 - <<'PY'
          import json, os
          src = os.environ["RUNNER_TEMP"] + "/perm-payload.json"
          p = json.load(open(src))
          full = {k: p.get(k) or [] for k in ("topEmployers", "topAttorneys", "topOccupations")}
          for k, v in full.items():
              print(f"{k:16s} {len(v):,} entities")
          # The aggregate document carries the head of each list; the table
          # carries all of it. One order, so ranks and slugs agree.
          TOP = 250
          for k in full:
              p[k] = sorted(full[k], key=lambda r: -r["total"])[:TOP]
          out = os.environ["RUNNER_TEMP"] + "/perm-aggregate.json"
          json.dump(p, open(out, "w"))
          size = os.path.getsize(out) / 1024 / 1024
          print(f"aggregate document {size:.2f} MB")
          if size > 0.9:
              raise SystemExit("FATAL: aggregate payload is near the 1 MB document limit")
          PY

      - name: Store every entity in its own table
        working-directory: v2
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "CONVEX_DEPLOY_KEY absent; skipping (payload is in the artifact)" >&2
            exit 0
          fi
          python3 scripts/store_entities.py --payload "${RUNNER_TEMP}/perm-payload.json" --prod

      - name: Store aggregates in Convex
        working-directory: v2
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "WARNING: CONVEX_DEPLOY_KEY secret is not set on this repo." >&2
            echo "The payloads are uploaded as the federal-payloads artifact;" >&2
            echo "store them manually with npx convex run ...:storeStats." >&2
            exit 1
          fi
          # DOL is required - the job exists for this payload.
          npx --yes convex run permDisclosure:storeStats \
            "$(cat "${RUNNER_TEMP}/perm-aggregate.json")" --prod
          if [ -s "${RUNNER_TEMP}/uscis-payload.json" ]; then
            npx --yes convex run uscisI140:storeStats \
              "$(cat "${RUNNER_TEMP}/uscis-payload.json")" --prod
          else
            echo "USCIS payload absent; skipping (see the step above)"
          fi
          if [ -s "${RUNNER_TEMP}/visa-bulletin.json" ]; then
            npx --yes convex run visaBulletin:storeBulletins \
              "$(cat "${RUNNER_TEMP}/visa-bulletin.json")" --prod
          else
            echo "visa bulletin payload absent; skipping (see the step above)"
          fi
